<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchopork</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --border: #262b33; --text: #e6e8eb;
    --muted: #8b94a3; --accent: #5eead4; --danger: #f87171; --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
  .wide #app { max-width: 1080px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  p.lede { color: var(--muted); margin: 0 0 32px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    width: 100%; background: #0e1114; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font: inherit; font-family: var(--mono); font-size: 13px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    background: var(--accent); color: #06231e; border: none; border-radius: 6px;
    padding: 9px 16px; font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 14px;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); color: #2a0a0a; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button + button { margin-left: 8px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > div { flex: 1; }
  .steps { display: flex; gap: 6px; margin-bottom: 28px; }
  .steps span { flex: 1; height: 3px; border-radius: 2px; background: var(--border); }
  .steps span.done, .steps span.current { background: var(--accent); }
  .toolchain, .skill, .provider-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .toolchain:last-child, .skill:last-child, .provider-row:last-child { border-bottom: none; }
  .ok { color: var(--accent); } .bad { color: var(--danger); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat { font-size: 24px; font-weight: 700; }
  .stat-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  #trace { font-family: var(--mono); font-size: 12px; max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
  .trace-entry { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .trace-entry .tag { color: var(--accent); font-weight: 600; }
  .error-banner { background: #2a1414; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .checkbox-row input { width: auto; }
  .snapshot-id { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

const $ = (sel, el = document) => el.querySelector(sel);
const el = (tag, props = {}, ...children) => {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  });
  children.flat().forEach((c) => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.error) || `HTTP ${res.status}`);
  return body;
}

const STEPS = ["welcome", "permissions", "vcs", "skills", "dashboard"];

let errorMsg = null;
function showError(e) { errorMsg = e.message || String(e); render(); }
function clearError() { errorMsg = null; }

async function render() {
  const app = $("#app");
  app.innerHTML = "";
  document.body.classList.remove("wide");

  let wizard;
  try {
    wizard = await api("/api/wizard");
  } catch (e) {
    app.appendChild(el("div", { class: "error-banner", text: `Cannot reach orchopork: ${e.message}` }));
    return;
  }

  if (errorMsg) app.appendChild(el("div", { class: "error-banner", text: errorMsg }));

  const stepIdx = STEPS.indexOf(wizard.step);
  const bar = el("div", { class: "steps" });
  STEPS.forEach((s, i) => bar.appendChild(el("span", { class: i < stepIdx ? "done" : i === stepIdx ? "current" : "" })));
  app.appendChild(bar);

  const renderers = { welcome, permissions, vcs, skills, dashboard };
  await renderers[wizard.step](app, wizard);
}

function welcome(app) {
  app.appendChild(el("h1", { text: "orchopork" }));
  app.appendChild(el("p", { class: "lede", text:
    "A lean local/cloud LLM agent orchestration engine. Cheap local models (Ollama) do the routine work; " +
    "frontier APIs (Claude, DeepSeek, Gemini) step in only when needed, under a hard monthly budget. " +
    "Every step is checkpointed to git and SQLite, so any run can be paused, rewound, or replayed." }));
  const panel = el("div", { class: "panel" });
  panel.appendChild(el("button", { text: "Initialize Workspace", onclick: async () => {
    clearError();
    try { await api("/api/wizard/initialize", { method: "POST" }); render(); } catch (e) { showError(e); }
  }}));
  app.appendChild(panel);
}

function permissions(app) {
  app.appendChild(el("h1", { text: "Environment & Permissions" }));
  app.appendChild(el("p", { class: "lede", text: "Pick the workspace directory. orchopork checks read/write access and probes local toolchains." }));
  const panel = el("div", { class: "panel" });
  const input = el("input", { type: "text", value: ".", placeholder: "/path/to/workspace" });
  panel.appendChild(el("label", { text: "Workspace path" }));
  panel.appendChild(input);
  const results = el("div", { style: "margin-top:16px" });
  panel.appendChild(results);
  panel.appendChild(el("button", { text: "Check & Continue", onclick: async () => {
    clearError();
    try {
      await api("/api/wizard/workspace", { method: "POST", body: JSON.stringify({ path: input.value }) });
      render();
    } catch (e) {
      showError(e);
      try {
        const w = await api("/api/wizard");
        if (w.permissions) renderReport(results, w.permissions);
      } catch {}
    }
  }}));
  app.appendChild(panel);
}

function renderReport(container, report) {
  container.innerHTML = "";
  container.appendChild(el("div", { class: "toolchain" },
    el("span", { text: "Readable" }), el("span", { class: report.readable ? "ok" : "bad", text: report.readable ? "yes" : "no" })));
  container.appendChild(el("div", { class: "toolchain" },
    el("span", { text: "Writable" }), el("span", { class: report.writable ? "ok" : "bad", text: report.writable ? "yes" : "no" })));
  report.toolchains.forEach((t) => {
    container.appendChild(el("div", { class: "toolchain" },
      el("span", { text: `${t.name}${t.required ? " (required)" : ""}` }),
      el("span", { class: t.version ? "ok" : (t.required ? "bad" : ""), text: t.version || "not found" })));
  });
}

function vcs(app) {
  app.appendChild(el("h1", { text: "Source Control & Remote Sync" }));
  app.appendChild(el("p", { class: "lede", text: "orchopork checkpoints every agent step as a git commit. The workspace must be (or become) a git repository." }));
  const panel = el("div", { class: "panel" });
  panel.appendChild(el("div", { class: "checkbox-row" },
    el("input", { type: "checkbox", id: "init", checked: "checked" }),
    el("label", { for: "init", text: "Initialize git here if it isn't a repo yet", style: "margin:0" })));
  panel.appendChild(el("label", { text: "Remote auth (optional)" }));
  const sel = el("select");
  [["none", "None"], ["pat", "GitHub PAT"], ["ssh", "SSH key"]].forEach(([v, t]) => sel.appendChild(el("option", { value: v, text: t })));
  panel.appendChild(sel);
  panel.appendChild(el("button", { text: "Continue", onclick: async () => {
    clearError();
    try {
      await api("/api/wizard/vcs", { method: "POST", body: JSON.stringify({
        init_if_missing: $("#init", panel).checked, remote_auth: sel.value }) });
      render();
    } catch (e) { showError(e); }
  }}));
  app.appendChild(panel);
}

async function skills(app) {
  app.appendChild(el("h1", { text: "Providers & Skills" }));
  app.appendChild(el("p", { class: "lede", text: "Point orchopork at a local Ollama endpoint and/or cloud providers, then choose which skills shape the agent's tone and tools." }));

  const providersPanel = el("div", { class: "panel" });
  providersPanel.appendChild(el("h2", { text: "Providers" }));
  const chosen = new Set(["ollama"]);
  [["ollama", "Ollama (local, free)"], ["claude", "Claude"], ["deepseek", "DeepSeek"], ["gemini", "Gemini"]].forEach(([id, label]) => {
    const row = el("div", { class: "provider-row" });
    const box = el("input", { type: "checkbox", ...(id === "ollama" ? { checked: "checked", disabled: "disabled" } : {}) });
    box.addEventListener("change", () => { if (box.checked) chosen.add(id); else chosen.delete(id); });
    row.appendChild(el("div", {}, box, el("label", { text: " " + label, style: "display:inline" })));
    if (id !== "ollama") {
      const key = el("input", { type: "password", placeholder: "API key", style: "width:220px" });
      key.dataset.provider = id;
      row.appendChild(key);
    }
    providersPanel.appendChild(row);
  });
  app.appendChild(providersPanel);

  const skillsPanel = el("div", { class: "panel" });
  skillsPanel.appendChild(el("h2", { text: "Skills" }));
  let data;
  try { data = await api("/api/skills"); } catch (e) { skillsPanel.appendChild(el("div", { class: "error-banner", text: e.message })); data = { skills: [] }; }
  const enabled = new Set(data.skills.filter((s) => s.enabled).map((s) => s.name));
  data.skills.forEach((s) => {
    const row = el("div", { class: "skill" });
    const box = el("input", { type: "checkbox", ...(s.enabled ? { checked: "checked" } : {}) });
    box.addEventListener("change", () => { if (box.checked) enabled.add(s.name); else enabled.delete(s.name); });
    row.appendChild(el("div", {}, box, el("label", { text: ` ${s.name}`, style: "display:inline;font-weight:600" }),
      el("div", { class: "stat-label", text: s.description })));
    skillsPanel.appendChild(row);
  });
  app.appendChild(skillsPanel);

  const cta = el("button", { text: "Enter Dashboard", onclick: async () => {
    clearError();
    try {
      for (const input of providersPanel.querySelectorAll("input[data-provider]")) {
        if (input.value) await api("/api/providers/keys", { method: "POST", body: JSON.stringify({ provider: input.dataset.provider, api_key: input.value }) });
      }
      await api("/api/wizard/skills", { method: "POST", body: JSON.stringify({
        enabled_skills: [...enabled], providers: [...chosen] }) });
      render();
    } catch (e) { showError(e); }
  }});
  app.appendChild(cta);
}

async function dashboard(app) {
  document.body.classList.add("wide");
  app.appendChild(el("h1", { text: "Command Dashboard" }));

  const budgetPanel = el("div", { class: "panel grid" });
  app.appendChild(budgetPanel);
  refreshBudget(budgetPanel);

  const runPanel = el("div", { class: "panel" });
  runPanel.appendChild(el("h2", { text: "Run" }));
  const thread = el("input", { type: "text", value: "default", placeholder: "thread id" });
  const node = el("select");
  ["planner", "coder", "critic", "test_runner", "tool_executor"].forEach((n) => node.appendChild(el("option", { value: n, text: n })));
  const provider = el("select");
  ["ollama", "claude", "deepseek", "gemini"].forEach((p) => provider.appendChild(el("option", { value: p, text: p })));
  const model = el("input", { type: "text", value: "llama3", placeholder: "model" });

  runPanel.appendChild(el("div", { class: "row" },
    el("div", {}, el("label", { text: "Thread" }), thread),
    el("div", {}, el("label", { text: "Node" }), node),
    el("div", {}, el("label", { text: "Provider" }), provider),
    el("div", {}, el("label", { text: "Model" }), model)));

  const out = el("div", { style: "margin-top:12px" });
  runPanel.appendChild(out);

  const stepBtn = el("button", { text: "Step ▶", onclick: async () => {
    clearError(); stepBtn.disabled = true;
    try { out.textContent = JSON.stringify(await api("/api/run/step", { method: "POST",
      body: JSON.stringify({ thread_id: thread.value, node: node.value, provider: provider.value, model: model.value }) }), null, 2);
      loadHistory(); } catch (e) { showError(e); render(); } finally { stepBtn.disabled = false; }
  }});
  runPanel.appendChild(stepBtn);
  runPanel.appendChild(el("button", { class: "secondary", text: "⏸ Pause", onclick: () => {
    out.textContent = "Paused: nothing calls Step until you press it again.";
  }}));
  app.appendChild(runPanel);

  const injectPanel = el("div", { class: "panel" });
  injectPanel.appendChild(el("h2", { text: "Inject" }));
  const injectText = el("textarea", { placeholder: "Steer the next step with a message..." });
  injectPanel.appendChild(injectText);
  injectPanel.appendChild(el("button", { text: "Inject", onclick: async () => {
    clearError();
    try { await api("/api/run/inject", { method: "POST", body: JSON.stringify({ thread_id: thread.value, text: injectText.value }) });
      injectText.value = ""; loadHistory(); } catch (e) { showError(e); render(); }
  }}));
  app.appendChild(injectPanel);

  const rewindPanel = el("div", { class: "panel" });
  rewindPanel.appendChild(el("h2", { text: "Rewind" }));
  const steps = el("input", { type: "number", value: "1", min: "1" });
  rewindPanel.appendChild(el("div", { class: "row" },
    el("div", {}, el("label", { text: "Steps back" }), steps),
    el("button", { class: "danger", text: "Rewind", onclick: async () => {
      clearError();
      try { await api("/api/run/rewind", { method: "POST", body: JSON.stringify({ thread_id: thread.value, steps: Number(steps.value) }) });
        loadHistory(); } catch (e) { showError(e); render(); }
    }})));
  app.appendChild(rewindPanel);

  const historyPanel = el("div", { class: "panel" });
  historyPanel.appendChild(el("h2", { text: "History" }));
  const historyList = el("div");
  historyPanel.appendChild(historyList);
  app.appendChild(historyPanel);

  const tracePanel = el("div", { class: "panel" });
  tracePanel.appendChild(el("h2", { text: "Live Trace" }));
  const trace = el("div", { id: "trace" });
  tracePanel.appendChild(trace);
  app.appendChild(tracePanel);

  async function loadHistory() {
    try {
      const h = await api(`/api/run/history?thread_id=${encodeURIComponent(thread.value)}`);
      historyList.innerHTML = "";
      h.forEach((snap) => historyList.appendChild(el("div", { class: "skill" },
        el("div", {}, el("strong", { text: snap.node }), " ", el("span", { class: "snapshot-id", text: snap.id.slice(0, 8) })),
        el("span", { class: "stat-label", text: `$${snap.accumulated_cost_usd.toFixed(4)} · seq ${snap.seq}` }))));
    } catch { historyList.textContent = "(no history yet)"; }
  }
  loadHistory();

  let es;
  function connectTrace() {
    if (es) es.close();
    es = new EventSource(`/api/run/stream?thread_id=${encodeURIComponent(thread.value)}`);
    es.onmessage = (msg) => {
      const ev = JSON.parse(msg.data);
      trace.appendChild(el("div", { class: "trace-entry" }, el("span", { class: "tag", text: `[${ev.kind}] ` }), JSON.stringify(ev)));
      trace.scrollTop = trace.scrollHeight;
    };
  }
  connectTrace();
  thread.addEventListener("change", () => { loadHistory(); connectTrace(); });
}

async function refreshBudget(panel) {
  try {
    const b = await api("/api/providers/budget");
    panel.innerHTML = "";
    panel.appendChild(el("div", {}, el("div", { class: "stat", text: `$${b.spent_this_month_usd.toFixed(2)}` }), el("div", { class: "stat-label", text: "spent this month" })));
    panel.appendChild(el("div", {}, el("div", { class: "stat", text: `$${b.remaining_usd.toFixed(2)}` }), el("div", { class: "stat-label", text: "remaining" })));
  } catch (e) { panel.appendChild(el("div", { class: "error-banner", text: e.message })); }
}

render();
</script>
</body>
</html>
