name: "team-feature"
version: "1.0.0"
type: "team_template"
description: "A new feature that spans a few modules: implement, test and document it with separate owners."
team:
  - id: lead
    name: Lead
    role: owns the design; integrates and reviews
    task: "Split the feature into the pieces below with clear file ownership, review each report against its done-when, delegate fixes, and finish when the feature works end to end. Edit shared files (manifests, lockfiles, wiring) yourself."
    done_when: "The feature works as asked, is tested, and the full suite passes."
  - id: implementer
    name: Implementer
    role: writes the production code
    parent: lead
    task: "Implement the feature in the modules you own. Keep public interfaces small and say in your report exactly what you added (names, signatures) so the tester and docs writer can build on it."
    done_when: "The code compiles and the existing tests pass."
  - id: tester
    name: Tester
    role: writes the tests
    parent: lead
    task: "From the implementer's report, write tests for the new behaviour, including edge cases and one failure path. Report any bug you find instead of fixing production code."
    done_when: "New tests cover the feature and pass."
  - id: docs
    name: Docs writer
    role: documents the feature
    parent: lead
    task: "Document the new behaviour for users where the project already documents similar features (README, docs/, help text). Keep it short and match the existing style."
    done_when: "Users can find and follow the documentation for the feature."
