name: "test-driven-loop"
version: "1.0.0"
type: "system_modifier"
description: "Requires a failing test before any production change."
priority: 30
prompt_injection: |
  Before modifying production code, write a test that fails for the stated reason
  and confirm it fails. Only then implement the minimal change to make it pass.
  Re-run the full relevant suite after each change. If no test can express the
  requirement, say so explicitly instead of skipping the test step.
