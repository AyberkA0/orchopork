<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchopork</title>
<link rel="icon" href="/logo.png">
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("op.theme")) || "dark"; } catch { document.documentElement.dataset.theme = "dark"; }</script>
<style>
/* The look of the README's figures: paper and ink, hairline frames, square
   corners, round nodes, one coral accent, lowercase mono labels. Dark is
   the default; light is the figures' own paper. */
:root, :root[data-theme="dark"] {
  --bg: #161413; --bg2: #1d1a19; --panel: #1e1b1a; --line: rgba(239,235,228,.13); --frame: rgba(239,235,228,.62);
  --text: #efebe4; --muted: #a39c96; --faint: #6f6964;
  --accent: #f37e8f; --accent2: #f37e8f; --accent-ink: #231f20; --ok: #8cc79a; --warn: #e9b65c; --bad: #ff8a6b;
  --glow: rgba(243,126,143,.16); --shadow: none; --paper-dots: rgba(239,235,228,.09);
  --surface: #262220; --surface2: #302b28; --hair: rgba(239,235,228,.06);
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f7f6f3; --bg2: #f0eee9; --panel: #fdfcfa; --line: rgba(35,31,32,.13); --frame: #231f20;
  --text: #231f20; --muted: #8c8686; --faint: #b1abaa;
  --accent: #f37e8f; --accent2: #f37e8f; --accent-ink: #231f20; --ok: #2f7d4b; --warn: #a3620a; --bad: #b8402c;
  --glow: rgba(243,126,143,.2); --shadow: none; --paper-dots: rgba(35,31,32,.12);
  --surface: #ebe8e2; --surface2: #e2ded7; --hair: rgba(35,31,32,.07);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14.5px/1.55 var(--sans); }
button { font: 600 13px var(--sans); cursor: pointer; border-radius: 9px; padding: 8px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
button.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { background: var(--bg2); color: var(--text); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { width: 100%; font: 13.5px var(--sans); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
textarea { resize: vertical; }
label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
.mono { font-family: var(--mono); } .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.row { display: flex; gap: 8px; align-items: center; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11px var(--sans); padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.running { color: var(--accent); border-color: var(--accent); } .pill.done { color: var(--ok); border-color: var(--ok); } .pill.paused { color: var(--warn); border-color: var(--warn); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.running .dot, .pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 50; pointer-events: none; }
.banner { display: flex; gap: 10px; align-items: center; }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 50; max-width: 80vw; box-shadow: var(--shadow); }
.toast.err { background: var(--bad); color: #fff; }

/* shell */
.shell { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
.shell.collapsed { grid-template-columns: 0 1fr; }
.side { background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.side .top { padding: 14px 12px 8px; }
.brand { font: 800 15px var(--mono); letter-spacing: -.03em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 18px; height: 18px; border-radius: 6px; background: conic-gradient(from 200deg, var(--accent), var(--accent2), var(--accent)); display: inline-block; }
.hist { flex: 1; overflow-y: auto; padding: 4px 8px; }
.hist h6 { margin: 14px 6px 4px; font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.hitem { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); }
.hitem:hover { background: var(--panel); } .hitem.sel { background: var(--panel); box-shadow: var(--shadow); }
.hitem .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hitem .ic { width: 16px; text-align: center; color: var(--muted); }
.side .foot { padding: 10px 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.meter { height: 4px; background: var(--line); border-radius: 3px; overflow: hidden; } .meter > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.main { position: relative; min-width: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 52px; }
.topbar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* home */
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 26px; }
.hero h1 { font-size: 30px; letter-spacing: -.025em; margin: 0; font-weight: 650; text-align: center; }
.hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.composer { width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 12px 10px 16px; transition: box-shadow .2s, border-color .2s; }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow), var(--shadow); }
.composer textarea { border: 0; box-shadow: none; padding: 4px 0; font-size: 15.5px; min-height: 28px; max-height: 280px; resize: none; background: transparent; }
.composer textarea:focus { box-shadow: none; }
.composer .bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.send { width: 36px; height: 36px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--text); color: var(--bg); border: 0; font-size: 17px; }
.send.stop { background: var(--bad); color: #fff; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
.chip { font-size: 12.5px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--text); border-color: var(--faint); }
.verify-in { border: 0; border-top: 1px dashed var(--line); border-radius: 0; padding: 8px 0 2px; font: 12.5px var(--mono); box-shadow: none !important; }

/* chat */
.scroll { flex: 1; overflow-y: auto; }
.thread { width: min(780px, 100%); margin: 0 auto; padding: 8px 20px 30px; }
.msg-user { display: flex; justify-content: flex-end; margin: 18px 0; }
.msg-user > div:not(.steptools) { background: var(--bg2); border: 1px solid var(--line); padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 82%; white-space: pre-wrap; }
.msg-ai { margin: 14px 0; white-space: pre-wrap; }
.act { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 13.5px; }
.act .ic { width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center; background: var(--bg2); border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.act.fail .ic { color: var(--bad); border-color: var(--bad); }
.act .body { min-width: 0; flex: 1; }
.act .tl { color: var(--muted); } .act .tl b { color: var(--text); font-weight: 600; }
details.out summary { cursor: pointer; color: var(--faint); font-size: 12px; list-style: none; }
details.out summary::-webkit-details-marker { display: none; }
details.out pre, pre.block { background: var(--bg2); border: 1px solid var(--line); padding: 10px; border-radius: 9px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 380px; overflow: auto; margin: 6px 0 0; }
.sysline { text-align: center; font-size: 12px; color: var(--faint); margin: 16px 0; }
.thinking { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin: 14px 0; }
.dots i { display: inline-block; width: 5px; height: 5px; margin-right: 3px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
.dock { padding: 8px 20px 18px; display: flex; justify-content: center; }
.banner { width: min(780px, 100%); margin: 8px auto; border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 9px 12px; font-size: 13px; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10,10,14,.42); display: grid; place-items: center; z-index: 30; padding: 16px; animation: fade .1s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: 88vh; overflow: auto; padding: 22px; animation: rise .12s ease-out; }
.modal.wide { width: min(900px, 100%); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.modal h2 { margin: 0 0 6px; font-size: 19px; letter-spacing: -.01em; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.choice button { text-align: left; padding: 14px; border-radius: 14px; font-weight: 400; display: grid; gap: 4px; }
.choice button b { font-size: 14px; } .choice button span { color: var(--muted); font-size: 12.5px; }
.choice button.hot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.orb { width: 54px; height: 54px; border-radius: 16px; margin-bottom: 12px; background: radial-gradient(circle at 30% 30%, var(--accent2), var(--accent)); box-shadow: 0 8px 30px var(--glow); }
.mlist { max-height: 340px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; }
.mitem { display: flex; gap: 10px; align-items: center; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.mitem:last-child { border-bottom: 0; } .mitem:hover { background: var(--bg2); } .mitem.sel { background: var(--glow); }
.mitem .p { font: 11px var(--mono); color: var(--muted); width: 72px; }

.center { flex: 1; display: grid; place-items: center; padding: 24px; }
.stack { display: grid; gap: 12px; width: min(560px, 100%); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: rot .8s linear infinite; margin: 0 auto 12px; }
@keyframes rot { to { transform: rotate(360deg); } }
.page { flex: 1; overflow-y: auto; } .page .inner { width: min(760px, 100%); margin: 0 auto; padding: 10px 20px 60px; }
.kv { display: grid; grid-template-columns: 90px 1fr auto auto auto; gap: 8px; align-items: center; margin-top: 8px; }
/* external agents */
.ext { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 10px 0 4px; background: var(--panel); }
.ext-h { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.ext-h b { color: var(--text); }
.ext-badge { font: 700 10px var(--mono); letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
.ext ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); max-height: 220px; overflow: auto; }
.ext li { padding: 2px 0; } .ext li b { font-weight: 500; color: var(--text); }
.mgroup { padding: 8px 12px 4px; font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; background: var(--bg2); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.spin.sm { width: 12px; height: 12px; border-width: 2px; margin: 0 6px 0 0; display: inline-block; }
.tuner select { font-size: 12.5px; }
.addgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.addcard { text-align: left; display: grid; gap: 3px; padding: 11px 12px; border-radius: 12px; font-weight: 400; }
.addcard:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.addcard b { font-size: 13.5px; }
.conn { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 10px; align-items: center; }
.fp { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; min-width: 0; max-width: 100%; }
.fp .crumbs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 10px; background: var(--bg2); border-bottom: 1px solid var(--line); font: 12px var(--mono); }
.fp .crumbs span { cursor: pointer; padding: 2px 4px; border-radius: 6px; min-width: 0; overflow-wrap: anywhere; } .fp .crumbs span:hover { background: var(--glow); }
.fp .crumbs .home { display: inline-flex; align-items: center; }
.fp .dirs .name { min-width: 0; overflow-wrap: anywhere; }
.fp .foot > * { min-width: 0; }
.fp .foot .ghost { flex: none; white-space: nowrap; }
.fp .foot .open { flex: 0 1 auto; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.fp .dirs { max-height: 280px; overflow: auto; }
.fp .foot { display: flex; gap: 8px; align-items: center; padding: 10px; border-top: 1px solid var(--line); background: var(--bg2); }
.recent { display: grid; gap: 6px; text-align: left; }
.recent .mitem { border: 1px solid var(--line); border-radius: 10px; }
.projbtn { width: 100%; text-align: left; display: flex; gap: 8px; align-items: center; margin-top: 10px; padding: 8px 10px; }
.projbtn .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice { border: 1px solid var(--warn); border-radius: 12px; padding: 12px; margin-top: 10px; text-align: left; font-size: 13px; }
.found { display: grid; gap: 6px; }
.found .mitem { border: 1px solid var(--line); border-radius: 10px; cursor: default; }
.mitem.off { opacity: .5; cursor: default; } .mitem.off:hover { background: none; }
.agents-grid { display: grid; grid-template-columns: 150px 150px 1fr auto auto auto auto; gap: 8px; align-items: center; margin-top: 10px; }
.msg-user.pending > div { opacity: .55; }
.live-line { transition: opacity .2s; }

/* skeletons: panels open instantly and shimmer until their data lands */
.sk { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--bg2) 25%, var(--line) 37%, var(--bg2) 63%); background-size: 400% 100%; animation: shimmer 1.3s ease-in-out infinite; }
.sk-line { height: 12px; margin: 8px 0; } .sk-line.w40 { width: 40%; } .sk-line.w60 { width: 60%; } .sk-line.w80 { width: 80%; }
.sk-bubble { height: 44px; width: 55%; border-radius: 16px; margin: 18px 0 18px auto; }
.sk-block { height: 64px; margin: 12px 0; border-radius: 12px; }
.sk-row { height: 38px; margin: 6px 0; border-radius: 10px; }
.sk-title { height: 16px; width: 45%; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* motion */
@media (prefers-reduced-motion: no-preference) {
  .shell { transition: grid-template-columns .2s cubic-bezier(.2,.8,.2,1); }
  .enter { animation: enter .18s cubic-bezier(.2,.8,.2,1) both; }
  .node { transition: left .28s cubic-bezier(.2,.8,.2,1), top .28s cubic-bezier(.2,.8,.2,1), box-shadow .15s, border-color .15s, transform .12s, opacity .15s; }
  .node.noanim { transition: none; }
  .node.leaving { opacity: 0; transform: scale(.94); }
  .node.born { animation: pop .35s cubic-bezier(.2,.8,.2,1) both; }
  .edges path { transition: d .28s cubic-bezier(.2,.8,.2,1), stroke .15s; }
  .stage.smooth { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  button { transition: transform .08s, background .15s, color .15s, border-color .15s, box-shadow .15s, opacity .15s; }
  button:active:not(:disabled) { transform: scale(.97); }
  .hitem { transition: background .15s, box-shadow .15s, transform .15s; }
  .hitem:active { transform: scale(.99); }
  .toast { animation: toastIn .26s cubic-bezier(.2,.8,.2,1) both; }
  .toast.out { animation: toastOut .2s ease-in forwards; }
  .scrim.out { animation: fadeOut .1s ease-in forwards; }
  .scrim.out .modal { animation: sink .1s ease-in forwards; }
  .live-line.swap { opacity: 0; }
  .pill { transition: color .25s, border-color .25s; }
  .meter > div { transition: width .6s cubic-bezier(.2,.8,.2,1); }
}
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
@keyframes pop { from { opacity: 0; transform: scale(.9); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes sink { to { opacity: 0; transform: translateY(6px) scale(.98); } }
/* sidebar: search, sections, per-run status */
.sfind { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.sfind input { padding: 6px 9px; font-size: 12.5px; background: var(--panel); }
.kbd { font: 600 10.5px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--panel); white-space: nowrap; }
.hist h6 { display: flex; align-items: center; gap: 6px; }
.hist h6 .n { font-weight: 500; letter-spacing: 0; }
.hitem { position: relative; }
.hitem .when { font-size: 11px; color: var(--faint); flex: none; }
.hitem .sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--line); }
.sdot.running { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.sdot.paused { background: var(--warn); } .sdot.done { background: var(--ok); } .sdot.error { background: var(--bad); }
.hitem.unread .t { font-weight: 650; }
.hitem .ud { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.hitem .pin { display: none; padding: 0 4px; border: 0; background: none; color: var(--faint); font-size: 12px; line-height: 1; }
.hitem:hover .pin, .hitem .pin.on { display: inline; } .hitem .pin.on { color: var(--warn); }
.hitem:hover .when { display: none; }
.hitem .dr { font-size: 11px; color: var(--faint); flex: none; }
.more-btn { width: 100%; text-align: left; font-size: 12px; padding: 6px 9px; }

/* step tools: rewind / edit, revealed on hover */
.stepwrap { position: relative; }
.steptools { position: absolute; top: 2px; right: 0; display: none; gap: 4px; z-index: 2; }
.stepwrap:hover > .steptools, .stepwrap:focus-within > .steptools { display: flex; }
.steptools button { white-space: nowrap; font-size: 11.5px; padding: 3px 8px; border-radius: 7px; background: var(--panel); box-shadow: var(--shadow); color: var(--muted); }
.steptools button:hover { color: var(--text); border-color: var(--accent); }
.busy .steptools { display: none !important; }
.msg-user.stepwrap { align-items: center; gap: 8px; }
.msg-user.stepwrap .steptools { position: static; order: -1; }

/* popover menu */
.pop { position: fixed; z-index: 45; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 5px; min-width: 210px; animation: fade .12s; }
.pop button { display: flex; width: 100%; gap: 8px; text-align: left; border: 0; background: none; font-weight: 500; padding: 7px 10px; border-radius: 8px; }
.pop button:hover { background: var(--bg2); } .pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.pop .d { color: var(--bad); }

/* command palette */
.modal.pal { padding: 0; overflow: hidden; width: min(640px, 100%); align-self: start; margin-top: 12vh; }
.pal input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 16px; font-size: 15px; box-shadow: none !important; }
.pal .res { max-height: 52vh; overflow-y: auto; padding: 6px; }
.pal .it { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 13.5px; }
.pal .it.on { background: var(--glow); }
.pal .it .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal .it .k { font-size: 11px; color: var(--faint); }
.pal .grp { padding: 8px 10px 3px; font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.pal .hint { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); display: flex; gap: 12px; }

/* home: pick up where you left off */
.resume { width: min(760px, 100%); display: grid; gap: 6px; }
.resume h6 { margin: 0 0 2px; font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.rcard { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); cursor: pointer; font-size: 13.5px; }
.rcard:hover { border-color: var(--faint); }
.rcard .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard.draft { border-style: dashed; }
.banner .row button { padding: 4px 10px; font-size: 12px; }
.toast.act { pointer-events: auto; cursor: pointer; }
.toast.act u { text-decoration: none; opacity: .75; margin-left: 8px; }

/* waiting for an answer */
.pill.waiting { color: var(--warn); border-color: var(--warn); }
.sdot.waiting { background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
.qcard { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 12px 0; background: var(--panel); }
.qcard.open { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(178,107,0,.12); }
.qcard .qh { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.qcard .qi { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--sans); background: var(--warn); color: #fff; flex: none; }
.qcard .qt { margin: 6px 0 2px 28px; font-size: 14px; }
.qcard .qopts { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0 28px; }
.qcard .qopts button { font-weight: 500; }
.qcard .qa { margin: 8px 0 4px 28px; align-items: flex-end; }
.qcard .qa textarea { min-height: 38px; }
.qcard > .row.small { margin-left: 28px; }
.qbanner { display: flex; gap: 10px; align-items: center; margin: 0 16px 8px; padding: 8px 12px; border: 1px solid var(--warn); border-radius: 12px; background: var(--panel); font-size: 13px; cursor: pointer; }
.qbanner b { color: var(--warn); }
.ans-from { display: flex; margin: 10px 0; }
.ans-from > div { border-left: 3px solid var(--accent2); padding: 4px 12px; font-size: 13.5px; }
/* markdown */
.md { white-space: normal; }
.md p { margin: 6px 0; white-space: pre-wrap; } .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 12px 0 4px; font-size: 14.5px; }
.md ul, .md ol { margin: 4px 0; padding-left: 22px; } .md li { margin: 2px 0; }
.md code { font: 12.5px var(--mono); background: var(--bg2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
/* outputs */
.outputs { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin: 16px 0 6px; background: var(--panel); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
.thumb { position: relative; padding: 0; height: 120px; overflow: hidden; border-radius: 10px; background: repeating-conic-gradient(var(--bg2) 0 25%, var(--panel) 0 50%) 0 0 / 16px 16px; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb iframe { width: 400%; height: 400%; transform: scale(.25); transform-origin: 0 0; border: 0; pointer-events: none; background: #fff; }
.thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 8px; font: 500 11px var(--sans); background: rgba(0,0,0,.55); color: #fff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fchip { display: inline-flex; gap: 6px; align-items: center; font: 500 12px var(--sans); padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.fic { font-size: 12px; color: var(--muted); } .fic.added { color: var(--ok); } .fic.deleted { color: var(--bad); }
.modal.xwide { width: min(1200px, 100%); height: 86vh; display: flex; flex-direction: column; }
.fviewer { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.fgrid { display: grid; grid-template-columns: 260px 1fr; gap: 12px; flex: 1; min-height: 0; margin-top: 8px; }
.flist { border: 1px solid var(--line); border-radius: 12px; overflow-y: auto; }
.fit { display: flex; gap: 8px; align-items: center; padding: 7px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--line); }
.fit:hover { background: var(--bg2); } .fit.on { background: var(--glow); }
.fit .fnm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fright { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.fbar { padding-bottom: 8px; }
.fpane { flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 12px; overflow: auto; display: flex; flex-direction: column; }
.fimg { flex: 1; display: grid; place-items: center; padding: 16px; background: repeating-conic-gradient(var(--bg2) 0 25%, var(--panel) 0 50%) 0 0 / 20px 20px; }
.fimg img { max-width: 100%; max-height: 70vh; }
.fframe { flex: 1; width: 100%; min-height: 60vh; border: 0; background: #fff; }
.ftext { padding: 10px 12px; } .ftext.fmd { padding: 10px 18px; }
.fempty { padding: 30px; text-align: center; color: var(--muted); }
pre.code { margin: 0; font: 12px/1.55 var(--mono); white-space: pre; }
pre.code .ln { display: inline-block; width: 42px; padding-right: 10px; text-align: right; color: var(--faint); user-select: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 11px; background: var(--panel); font-weight: 500; }
.seg button.on { background: var(--text); color: var(--bg); }
a.button { display: inline-block; text-decoration: none; font: 600 13px var(--sans); padding: 6px 10px; border-radius: 9px; color: var(--muted); }
a.button:hover { background: var(--bg2); color: var(--text); }
/* measurements */
.hstats { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; color: var(--muted); padding: 5px 9px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-top: 10px; }
.tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel); }
.tile .tl { font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.tile .tv { font: 650 20px var(--sans); letter-spacing: -.02em; margin-top: 2px; }
.tile .ts { font-size: 11.5px; color: var(--muted); }
.tile.warnt .tv { color: var(--warn); } .tile.badt .tv { color: var(--bad); }
.modal h4 { margin: 18px 0 6px; font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
svg.tline { width: 100%; height: auto; display: block; }
svg.tline .lab { font: 11px var(--sans); fill: var(--muted); }
.mtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.mtable th { text-align: left; font: 600 11px var(--sans); color: var(--faint); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mtable td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mtable td.nm { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.mtable .barc { width: 120px; } .mtable .bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.mtable.cmp td.best { color: var(--ok); font-weight: 650; }
.mtable a { color: var(--text); text-decoration: none; } .mtable a:hover { text-decoration: underline; }
.page .inner.wide { width: min(1080px, 100%); }
.mgrp { padding: 10px 0; border-bottom: 1px dashed var(--line); } .mgrp:last-child { border-bottom: 0; }

/* ---- the flow graph's tokens, on main's palette ---- */
:root, :root[data-theme="dark"] {
  --accent-fg: var(--accent); --accent-soft: var(--glow); --accent-line: rgba(243,126,143,.45);
  --hover: var(--surface); --panel-elevated: var(--surface); --line-strong: rgba(239,235,228,.22);
  --canvas-dots: var(--paper-dots); --shadow-pop: none;
  --ok-bg: rgba(140,199,154,.14); --warn-bg: rgba(233,182,92,.12); --bad-bg: rgba(255,138,107,.12);
  --r-sm: 6px; --r: 9px; --r-lg: 12px; --col: 780px;
}
:root[data-theme="light"] {
  --line-strong: rgba(35,31,32,.22);
  --ok-bg: rgba(47,125,75,.1); --warn-bg: rgba(163,98,10,.1); --bad-bg: rgba(184,64,44,.1);
}
.main { container: main / inline-size; }
/* A spinner beside its text (main centres spinners on their own). */
.row > .spin { margin: 0; flex: none; }
/* Long project paths in Recent shorten instead of widening the page. */
.stack, .recent { grid-template-columns: minmax(0, 1fr); }
.recent .mitem { min-width: 0; } .recent .mitem b { flex: none; }
/* The top bar: the title, then the actions; less important controls leave
   the bar as it narrows (the run menu keeps them). */
.topbar .title { flex: 1 1 0; min-width: 120px; }
.topbar > .grow { flex: 1 1 0; }
.tb-actions { display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-end; gap: 6px; margin-left: auto; min-width: 0; flex: 0 1 auto; overflow-x: auto; scrollbar-width: none; }
.tb-actions::-webkit-scrollbar { display: none; }
.tb-actions > *, .tb-actions .row > * { flex: none; }
.tb-actions .row { gap: 6px; flex-wrap: nowrap; }
.tb-actions .sep { width: 1px; height: 18px; background: var(--hair); flex: none; }
.topbar button, .topbar .pill, .topbar .small, .topbar .delta { white-space: nowrap; }
.topbar .stat { font: 11.5px var(--mono); color: var(--faint); }
.tb-compact { display: none !important; }
@container main (max-width: 1180px) { .tb-p3 { display: none !important; } }
@container main (max-width: 900px) { .tb-p2 { display: none !important; } .tb-compact { display: inline-flex !important; } }
@container main (max-width: 640px) {
  .topbar { flex-wrap: wrap; padding: 6px 8px 6px 12px; row-gap: 4px; }
  .topbar .title { flex-basis: calc(100% - 44px); min-width: 0; }
  .tb-actions { flex: 1 0 100%; justify-content: flex-start; margin-left: 0; padding-bottom: 2px; }
}
/* The worktree strip is information, not a warning: a plain surface, one line. */
.banner.wtbar { background: var(--surface); color: var(--text); padding: 5px 6px 5px 12px; }
.wtbar .wt-info { flex: 1 1 200px; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.wtbar .wt-branch { font: 600 12.5px var(--mono); flex: none; }
.wtbar .wt-path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.wtbar svg { color: var(--faint); }
.wtbar button { white-space: nowrap; }
.msg-ai.qask { border-left: 2px solid var(--accent); }
.metric-lbl { font: 500 10.5px/1.4 var(--mono); text-transform: lowercase; color: var(--faint); }
/* ---------- orchestra ---------- */
.orch { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 32cqw, 420px); min-height: 0; }
.orch.nopanel { grid-template-columns: minmax(0, 1fr); }
.cwrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.cwrap > .canvas { flex: 1; min-height: 0; }
/* Header of a running orchestra (bar, approval, worktree): never allowed to crowd out the canvas. */
.orch-head { flex: none; max-height: 42%; overflow-y: auto; border-bottom: 1px solid var(--line); }
.orch-head .topbar { border-bottom: 0; }
.orch-head .banner { width: auto; margin: 0 12px 8px; }
.orch-head .approval { width: auto; margin: 0 12px 8px; }
.runline { display: flex; align-items: center; gap: 10px; padding: 0 16px 8px; font: 12px var(--mono); color: var(--muted); min-width: 0; }
.runline .live-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.orch-switch { display: none; }
.canvas { position: relative; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--canvas-dots) 1px, transparent 1.3px); background-size: 22px 22px; cursor: grab; touch-action: none; user-select: none; }
.canvas.panning { cursor: grabbing; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage.smooth { transition: transform .32s cubic-bezier(.2,.8,.2,1); }

/* The editor's toolbar sits above the canvas; the run view's zoom floats. */
.hud { display: flex; align-items: center; gap: 2px; row-gap: 2px; padding: 5px 8px; border-bottom: 1px solid var(--line); background: var(--bg2); flex: none; flex-wrap: wrap; min-width: 0; }
.hud::-webkit-scrollbar { display: none; }
.hud button { flex: none; min-height: 28px; padding: 4px 9px; font-size: 12.5px; background: transparent; border-color: transparent; color: var(--muted); }
.hud button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.hud button.pick { border-color: var(--line); color: var(--text); max-width: 260px; overflow: hidden; }
.hud button.pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud button.pick .cap { color: var(--faint); flex: none; }
.hud .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex: none; }
.hud .picks { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; margin-left: auto; min-width: 0; }
.hud .zoom-badge { font: 500 11px var(--mono); color: var(--faint); min-width: 40px; text-align: center; flex: none; }
.hud.float { position: absolute; left: 12px; bottom: 12px; z-index: 10; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--panel-elevated); padding: 3px; box-shadow: var(--shadow-pop); max-width: calc(100% - 24px); flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
@container main (max-width: 1180px) { .hud .lbl { display: none; } }
@container main (max-width: 1000px) { .hud button.pick { max-width: 200px; } }
@container main (max-width: 640px) { .hud .pick .cap { display: none; } .hud .sep { display: none; } }
.hud.float button { min-height: 26px; padding: 3px 8px; }

.reserve { position: absolute; left: 12px; top: 12px; z-index: 10; width: 196px; max-height: calc(100% - 24px); overflow-y: auto; background: var(--panel-elevated); border: 1px solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 4px; }
.reserve h6 { margin: 0; padding: 6px 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.reserve h6:hover { color: var(--muted); }
.reserve h6 svg { margin-left: auto; transition: transform .15s; }
.reserve.min h6 svg { transform: rotate(-90deg); }
.reserve.min .tpl { display: none; }
.tpl { padding: 6px 8px; border-radius: var(--r); font-size: 12.5px; cursor: grab; border: 1px solid transparent; }
.tpl:hover { background: var(--hover); border-color: var(--line); }
.tpl .row { gap: 8px; }
.tpl .row b { font-weight: 500; }
.tpl .row svg { color: var(--muted); }
.tpl .small { font-size: 11.5px; margin: 1px 0 0 21px; line-height: 1.35; }
.tpl.par .row svg { color: var(--warn); }
.ghost-drag { position: fixed; z-index: 80; pointer-events: none; padding: 6px 10px; border-radius: var(--r); background: var(--panel-elevated); color: var(--text); border: 1px solid var(--accent); font-size: 12.5px; font-weight: 500; box-shadow: var(--shadow-pop); display: flex; align-items: center; gap: 6px; }

.deploy { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 7px 10px 7px 14px; border-top: 1px solid var(--line); background: var(--bg2); flex: none; }
.deploy .deploy-info { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 12px; }
.deploy .deploy-info .count { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
.deploy .hint { flex: 0 1 460px; min-width: 0; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deploy button { white-space: nowrap; }
.problems { min-width: 0; flex: 1; }
.problems button { max-width: 100%; justify-content: flex-start; color: var(--bad); font-size: 12px; padding: 2px 8px; min-height: 24px; border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: var(--bad-bg); }
.problems button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.problems .ok { font: 11.5px var(--mono); }
@container main (max-width: 1100px) { .deploy .hint { display: none; } }

/* Inspector next to the canvas. */
.panel { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg2); }
.panel .ph { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel .ph .row b { font-weight: 600; }
.panel .feed { flex: 1; overflow-y: auto; padding: 8px 14px 14px; min-height: 0; }
.panel .pc { padding: 8px 10px 10px; border-top: 1px solid var(--line); }
.panel .pc .composer textarea { font-size: 13.5px; }
.metrics-card { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin-top: 10px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.metric-item { display: flex; flex-direction: column-reverse; gap: 1px; padding: 6px 10px; background: var(--panel); min-width: 0; }
.metric-item:last-child:nth-child(odd) { grid-column: 1 / -1; }
.metric-val { font: 500 12.5px var(--mono); color: var(--text); overflow-wrap: anywhere; }

/* Nodes */
.canvas.flow svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; color: var(--line-strong); }
.canvas.flow svg path.e { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.canvas.flow svg path.e.note { stroke-dasharray: 5 5; stroke: var(--muted); }
.canvas.flow svg path.e.sel { stroke: var(--accent); stroke-width: 2; }
.canvas.flow svg path.e.live { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; animation: flowdash .8s linear infinite; }
.canvas.flow svg path.e.drafting { stroke: var(--accent); stroke-dasharray: 4 4; }
.canvas.flow svg path.hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; pointer-events: stroke; }
@keyframes flowdash { to { stroke-dashoffset: -11; } }
.elabels { position: absolute; left: 0; top: 0; }
.elabel { position: absolute; transform: translate(-50%, -50%); display: inline-flex; gap: 3px; align-items: center; background: var(--panel-elevated); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0 6px; font: 600 10px/1.7 var(--mono); color: var(--muted); cursor: pointer; z-index: 3; white-space: nowrap; }
.elabel b { color: var(--accent-fg); }
.elabel .cnt { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 5px; margin-left: 2px; }
.elabel.sel { border-color: var(--accent); }
.fnode { position: absolute; width: 220px; min-height: 104px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 9px 12px 10px; cursor: pointer; user-select: none; transition: box-shadow .12s, border-color .12s; z-index: 2; }
.fnode:hover { border-color: var(--faint); }
.fnode.done { border-color: color-mix(in srgb, var(--ok) 50%, var(--line-strong)); }
.fnode.dynamic { border-style: dashed; }
.fnode.active { border-color: var(--accent-line); }
.fnode.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
/* Kind stripes (start, end, dispatcher) survive every state above. */
.fnode.k-lead { border-left: 3px solid var(--accent); }
.fnode.k-goal { border-left: 3px solid var(--ok); }
.fnode.k-parallel { border-left: 3px solid var(--warn); }
.fnode.end { border-right: 2px solid color-mix(in srgb, var(--ok) 70%, transparent); }
/* An indeterminate bar along the top edge while the node works. */
.fnode.active::after { content: ""; position: absolute; left: 10px; right: 10px; top: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent) no-repeat; background-size: 40% 100%; animation: scan 1.3s linear infinite; pointer-events: none; }
@keyframes scan { from { background-position: -70% 0; } to { background-position: 170% 0; } }
.fnode.drop { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.fnode.nodrop { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.fnode .rank { font: 500 10px/1.5 var(--mono); letter-spacing: .06em; color: var(--faint); display: flex; align-items: center; gap: 5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; padding-right: 64px; }
.fnode.k-lead .rank { color: var(--accent-fg); }
.fnode.k-goal .rank { color: var(--ok); }
.fnode.k-parallel .rank { color: var(--warn); padding-right: 36px; }
.fnode .rank .then { position: absolute; right: 12px; top: 22px; font-size: 10px; color: var(--faint); letter-spacing: 0; text-transform: none; }
.fnode .nm { font-weight: 600; font-size: 13.5px; margin-top: 3px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.fnode .nm .grow { overflow: hidden; text-overflow: ellipsis; }
.fnode .nm .icon { display: inline-flex; color: var(--muted); flex: none; }
.fnode .rl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fnode .tk { font-size: 11.5px; color: var(--faint); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.fnode .st { position: absolute; top: 8px; right: 10px; font: 500 10.5px/1.5 var(--mono); white-space: nowrap; }
.fnode .st.pill { max-width: 104px; overflow: hidden; text-overflow: ellipsis; display: block; font-size: 10px; top: 7px; }
.fnode.active .st:not(.pill) { color: var(--accent-fg); }
.fnode .small.faint { font: 11px var(--mono); }
.fnode .dyn { position: absolute; bottom: 8px; right: 10px; font: 600 10px var(--mono); color: var(--accent-fg); }
.fnode .issue { position: absolute; bottom: 7px; right: 10px; color: var(--warn); font-weight: 700; }
.fnode .eye { display: inline-flex; color: var(--muted); margin-left: 2px; }
.fnode .net { flex: none; font: 600 9.5px var(--mono); color: var(--warn); letter-spacing: .02em; }
.fnode .nbtag { display: flex; align-items: center; gap: 5px; margin-top: 5px; font: 11px var(--mono); color: var(--warn); white-space: nowrap; overflow: hidden; }
.fnode .nbtag span { overflow: hidden; text-overflow: ellipsis; }
.fnode .ctx { font: 10.5px var(--mono); color: var(--faint); margin-top: 5px; display: flex; gap: 8px; align-items: center; }
.fnode .ctxbar { flex: 1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.fnode .ctxbar i { display: block; height: 100%; background: var(--accent); }
.fnode .ctxbar i.hot { background: var(--warn); }
.fnode .port { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line-strong); z-index: 4; transition: background .12s, border-color .12s, transform .12s; }
.fnode .port.in { left: -6px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.fnode .port.out { right: -6px; top: 50%; transform: translateY(-50%); cursor: crosshair; }
.canvas.editing .fnode:hover .port.out, .fnode.sel .port.out { border-color: var(--accent); }
.fnode .port.out:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-50%) scale(1.3); }
.fnode .port.branch { right: -7px; top: 50%; transform: translateY(-50%); cursor: crosshair; border-color: var(--warn); }
.fnode .port.branch.new { background: transparent; border-style: dashed; }
.fnode .brow { position: absolute; left: 8px; right: 0; height: 22px; display: flex; align-items: center; gap: 6px; padding: 0 16px 0 6px; font-size: 11.5px; border-radius: var(--r-sm); background: var(--bg2); border: 1px solid var(--line); }
.fnode .brow.new { background: transparent; border-style: dashed; }
.fnode .brow .bn { font: 600 10.5px var(--mono); color: var(--faint); min-width: 10px; }
.fnode .brow .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fnode .brow.st-running { border-color: var(--accent-line); }
.fnode .brow.st-finished { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
.fnode .brow.st-failed, .fnode .brow.st-cancelled { opacity: .7; }
.fnode .brow .bst { font-size: 11px; }
.fnode .brow.st-running .bst { color: var(--accent-fg); }
.fnode .brow.st-finished .bst { color: var(--ok); }
.fnode .brow.st-failed .bst { color: var(--bad); }
.fnode.k-group { box-shadow: 4px 4px 0 -1px var(--panel), 4px 4px 0 0 var(--line-strong), 8px 8px 0 -1px var(--panel), 8px 8px 0 0 var(--line-strong); }
.fnode.k-group.sel { box-shadow: 0 0 0 1px var(--accent), 4px 4px 0 -1px var(--panel), 4px 4px 0 0 var(--accent-line), 8px 8px 0 -1px var(--panel), 8px 8px 0 0 var(--accent-line); }
.fnode .members { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.fnode .mchip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 0 6px; border-radius: var(--r-sm); background: var(--bg2); border: 1px solid var(--line); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.fnode .mchip.ok { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
.gframes { position: absolute; inset: 0; pointer-events: none; }
.gframe { position: absolute; border: 1px dashed var(--line-strong); border-radius: var(--r-lg); background: color-mix(in srgb, var(--accent) 4%, transparent); z-index: 1; }
.gframe .gf-head { pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.gframe .gf-head button { padding: 1px 8px; min-height: 22px; }
/* Box selection and the cursors of the editor's gestures. */
.canvas.flow.editing { cursor: default; }
.canvas.flow.space, .canvas.flow.space .fnode { cursor: grab; }
.canvas.flow.panning, .canvas.flow.panning .fnode { cursor: grabbing; }
.canvas.flow.moving .fnode.sel { cursor: move; }
.marquee { position: absolute; z-index: 30; pointer-events: none; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 2px; }

/* Link and notebook dialogs, the feed's messages. */
.caps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.capbox { display: flex !important; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); color: var(--text) !important; cursor: pointer; margin: 0; }
.capbox:hover { background: var(--hover); }
.capbox input { margin-top: 3px; }
.capbox.off { opacity: .55; cursor: default; }
.emsg { border: 1px solid var(--line); border-left-width: 2px; border-radius: var(--r); padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
.emsg .ebody { white-space: pre-wrap; font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
.emsg .ereply { white-space: pre-wrap; font-size: 13px; margin-top: 8px; padding: 6px 10px; border-left: 2px solid var(--accent); background: var(--bg2); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.emsg.t-approve, .emsg.t-report { border-left-color: var(--warn); }
.emsg.t-handoff { border-left-color: var(--accent); }
.emsg.t-note { border-left-color: var(--ok); }
.note { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; margin-bottom: 6px; white-space: pre-wrap; font-size: 13px; background: var(--bg); }
.delta { font: 500 11px var(--mono); white-space: nowrap; }
.delta .add { color: var(--ok); }
.delta .del { color: var(--bad); }
.livetext { margin: 6px 0 0; padding: 8px 10px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--mono); background: var(--bg2); border: 1px dashed var(--line-strong); border-radius: var(--r); color: var(--text); }
.livetext:empty { display: none; }
.livetext.thinking { color: var(--muted); font-style: italic; display: block; margin: 6px 0 0; padding: 8px 10px; }
.handback { border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-bg); border-radius: var(--r); padding: 8px 12px; white-space: pre-wrap; font-size: 13px; margin: 6px 0; }
.pf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pf-table td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.shot { max-width: 260px; max-height: 170px; border-radius: var(--r); border: 1px solid var(--line); cursor: zoom-in; background: #fff; }
.nbwin { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; }
.nbcard { border: 1px solid var(--line); border-left: 2px solid var(--warn); border-radius: var(--r); padding: 10px 12px; background: var(--panel); display: grid; gap: 6px; }
.nbcard textarea { font-size: 13px; }
.nbnotes { max-height: 320px; overflow-y: auto; margin-top: 4px; }

/* ---------- approvals, autonomy, browser ---------- */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); flex: none; padding: 2px; gap: 2px; }
.seg button { border: 0; border-radius: var(--r-sm); background: none; padding: 3px 9px; min-height: 22px; font-size: 12px; color: var(--muted); }
.seg button:hover:not(:disabled) { color: var(--text); background: var(--hover); }
.seg button.on, .seg button.on:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-fg); }
.approval { margin: 8px auto; width: min(var(--col), calc(100% - 32px)); padding: 10px 12px; min-width: 0; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 6%, var(--panel)); border-radius: var(--r); display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto; }
.approval > .row b { font-weight: 600; }
.approval code { display: block; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 12px; }
.approval details.out { margin-top: -4px; }
.approval pre { max-height: 200px; overflow: auto; margin: 6px 0 0; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; white-space: pre-wrap; word-break: break-word; }
.approval .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.approval .acts input { flex: 1 1 200px; min-width: 0; width: auto; padding: 5px 10px; }
.bpane { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 56vw); background: var(--panel); border-left: 1px solid var(--line-strong); box-shadow: var(--shadow-pop); z-index: 60; display: flex; flex-direction: column; }
.bpane .bbar { display: flex; gap: 4px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.bpane .bbar input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; padding: 5px 10px; }
.bpane .bbar button { flex: none; }
.bpane iframe { flex: 1; border: 0; width: 100%; background: #fff; }
.bpane .bnote { padding: 6px 10px; font-size: 11.5px; color: var(--faint); border-top: 1px solid var(--line); }

/* ---- figure style ---- */
/* Rounded but flat: the figures' hairlines and palette, with soft corners. */
* { box-shadow: none !important; }
.modal { border-radius: 18px; } .card, .outputs, .qcard, .composer { border-radius: 16px; }
.node, .tile, .rcard, .ext, .reserve, .deploy, .pop, .fpane, .flist, .fp, .mlist, .notice, .thumb { border-radius: 12px; }
button, input, select, textarea, .fchip, .seg, .hitem, .mitem, .fit, .pal .it, .ext-badge, .kbd, a.button { border-radius: 9px; }
.pill { border-radius: 99px; }
.meter, .meter > div, .mtable .bar { border-radius: 99px; }
.seg button { border-radius: 0; }
.dot, .sdot, .ud, .qi, .send, .spin, .dots i, .node .add, .brand i, .orb, .lane-dot { border-radius: 50% !important; }
body { letter-spacing: -.003em; }
button { border-color: var(--line); background: transparent; font-weight: 600; }
button:hover:not(:disabled) { border-color: var(--frame); }
button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
button.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost, button.ghost:hover { border-color: transparent; }
input, select, textarea { background: transparent; }
input:focus, select:focus, textarea:focus { border-color: var(--frame); box-shadow: none; outline: 2px solid var(--glow); outline-offset: 0; }
/* frames: what the figures draw as ink rectangles */
.composer, .card, .modal, .node, .qcard, .outputs, .tile, .rcard, .ext, .reserve, .deploy, .pop, .fpane, .flist, .fp, .mlist, .notice, .hud button, .thumb, .fchip, .choice button, .addcard, .seg { border: 1.25px solid var(--frame); }
.composer, .card, .modal, .node, .qcard, .outputs, .rcard, .reserve, .deploy, .pop { background: var(--panel); }
.composer:focus-within { border-color: var(--accent); box-shadow: none; }
.tile, .ext, .fchip { border-color: var(--line); }
.modal { border-width: 1.25px; }
.scrim { background: rgba(10,9,9,.55); }
/* labels: lowercase mono, like the figures' captions */
.hist h6, .mgroup, .card h3, .tile .tl, .modal h4, .reserve h6, .resume h6, .pal .grp, .mtable th, .node .rank, .pill, .kbd {
  font-family: var(--mono); text-transform: lowercase; letter-spacing: 0; font-weight: 500;
}
.card h3, .modal h4 { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
.card h3::before, .modal h4::before { content: ""; width: 8px; height: 8px; background: var(--accent); flex: none; }
.hist h6 { color: var(--muted); }
.mgroup { background: var(--panel); }
.pill { font-size: 10.5px; padding: 1px 7px; }
.pill.running, .node .rank { color: var(--accent); border-color: var(--accent); }
.tile .tv { font-family: var(--sans); font-weight: 700; }
/* brand */
.brand { font: 700 15px var(--sans); letter-spacing: -.02em; }
.brand img { width: 22px; height: 22px; display: block; }
.brand i { display: none; }
/* no gradients: coral fills and ink outlines */
.hero h1 { font-weight: 700; letter-spacing: -.03em; }
.hero h1 span { background: none; color: var(--accent); -webkit-text-fill-color: currentColor; }
.orb { background: var(--accent); box-shadow: none; outline: 1.25px solid var(--frame); outline-offset: 6px; width: 34px; height: 34px; }
.meter { height: 6px; border: 1px solid var(--frame); background: transparent; }
.meter > div, .mtable .bar { background: var(--accent); }
.ext-badge { background: none; color: var(--text); border: 1px solid var(--frame); font: 600 9.5px var(--mono); letter-spacing: 0; padding: 1px 5px; }
.send { background: var(--text); color: var(--bg); }
.toast { background: var(--text); color: var(--bg); border: 1.25px solid var(--text); }
.toast.err { background: var(--bad); border-color: var(--bad); color: #fff; }
/* selection: a coral rule on the left instead of a raised card */
.hitem.sel, .mitem.sel, .pal .it.on, .fit.on { background: var(--glow); }
.hitem:hover, .mitem:hover { background: var(--bg2); }
.choice button.hot, .addcard:hover { border-color: var(--accent); }
/* the canvas: dotted paper, ink edges, round-cornerless nodes */
.canvas { background-color: var(--bg); background-image: radial-gradient(var(--paper-dots) 1px, transparent 1px); }
.edges path { stroke: var(--frame); stroke-width: 1.25; }
.edges path.live { stroke: var(--accent); stroke-dasharray: 4 4; }
.node.sel { border-color: var(--accent); outline: 2px solid var(--glow); }
.node.active { border-color: var(--accent); } .node.active::after { border: 1.25px dashed var(--accent); inset: -6px; border-radius: 16px; }
.node.reported { border-color: var(--ok); }
.node.drop { border-color: var(--accent); outline: 4px solid var(--glow); }
.ghost-drag { background: var(--accent); color: var(--accent-ink); }
.qcard.open { border-color: var(--warn); }
.qcard .qi { background: var(--accent); color: var(--accent-ink); }
.ans-from > div { border-left-color: var(--accent); }
.thinking .dots i, .dots i { background: var(--accent); }
.seg button.on { background: var(--text); color: var(--bg); }
.mtable td, .mtable th { border-bottom-color: var(--line); }
.mtable.cmp td.best { color: var(--ok); }
details.out pre, pre.block { background: var(--bg2); border-color: var(--line); }
.verify-in { border-top-color: var(--line); }
.theme-btn { padding: 6px 8px; font-size: 13px; }
svg.ico { display: inline-block; vertical-align: -4px; flex: none; }
/* An icon and its label sit side by side (text nodes do not count for
   :last-child, so spacing comes from a flex gap). */
button:has(> svg.ico), .pill:has(> svg.ico) { display: inline-flex; align-items: center; gap: 7px; }
.pop button, .pop button:has(> svg.ico) { display: flex; align-items: center; gap: 9px; }
.steptools button:has(> svg.ico) { gap: 5px; }
.icon-btn { display: inline-grid; place-items: center; padding: 6px 8px; }
/* nodes carry the figures' markers: a coral disc for the lead, an ink ring for the rest */
.node .rank::before { content: ""; width: 9px; height: 9px; border: 1.25px solid var(--frame); border-radius: 50% !important; flex: none; }
.node.lead .rank::before { background: var(--accent); border-color: var(--accent); }
.node .rank .chev { display: none; }

/* ---- borderless: surfaces and tone separate things, not lines ---- */
*, *::before, *::after { border-color: transparent !important; }
/* Only large containers keep an edge, thin and nearly transparent. */
.modal, .composer, .side, .panel, .card, .outputs { border-color: var(--hair) !important; }
.modal, .composer, .card, .outputs { border-width: 1px !important; border-style: solid !important; }
/* fills instead of frames */
button { background: var(--surface); }
button:hover:not(:disabled) { background: var(--surface2); }
button.ghost { background: transparent; } button.ghost:hover:not(:disabled) { background: var(--surface); }
button.primary { background: var(--text); color: var(--bg); } button.primary:hover:not(:disabled) { background: var(--text); opacity: .88; }
button.accent, button.accent:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
button.danger { background: transparent; }
input, select, textarea { background: var(--surface); }
.composer textarea, .pal input, .qcard .qa textarea { background: transparent; }
/* Text typed into the composer or the palette needs no ring of its own:
   the composer shows focus on its edge. */
.composer textarea:focus, .pal input:focus, .qcard .qa textarea:focus { outline: none; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--glow); }
.composer:focus-within { border-color: rgba(243,126,143,.35) !important; }
.pill, .kbd, .ext-badge, .fchip, .seg, .act .ic, .chip { background: var(--surface); }
.pill.running { background: var(--glow); color: var(--accent); }
.pill.done { background: rgba(140,199,154,.14); color: var(--ok); }
.pill.paused, .pill.waiting { background: rgba(233,182,92,.14); color: var(--warn); }
.seg button { background: transparent; } .seg button.on { background: var(--text); color: var(--bg); }
.node, .tile, .rcard, .ext, .qcard, .reserve, .deploy, .pop, .fpane, .flist, .fp, .mlist, .notice, .hud button, .tpl, .addcard, .choice button { background: var(--panel); }
.tile, .ext { background: var(--bg2); }
.card .tile, .modal .tile, .modal .ext, .card .ext, .outputs .fchip { background: var(--surface); }
.modal .mlist, .modal .flist, .modal .fpane, .modal .fp { background: var(--bg2); }
.choice button.hot, .addcard:hover, .tpl:hover { background: var(--glow); }
.msg-user > div:not(.steptools) { background: var(--surface); }
details.out pre, pre.block, .md code { background: var(--surface); }
.md blockquote { background: var(--bg2); padding: 6px 10px; border-radius: 8px; }
.verify-in { background: var(--surface); border-radius: 9px; padding: 8px 10px; margin-top: 6px; }
.meter { background: var(--surface); }
.orb { outline: none; }
.spin { border-color: var(--surface2) !important; border-top-color: var(--accent) !important; }
/* states as tints */
.qcard.open { background: rgba(233,182,92,.08); }
.qbanner, .banner { background: rgba(233,182,92,.1); }
.notice { background: rgba(233,182,92,.08); }
.ans-from > div { background: var(--glow); border-radius: 12px; padding: 8px 12px; }
.node.sel { background: var(--surface); outline: 2px solid var(--glow); }
.node.active { background: var(--glow); } .node.active::after { display: none; }
.node.drop { background: var(--glow); outline: 3px solid var(--glow); }
/* Flow nodes have no frame to colour, so their states show as an outline and a tint. */
.fnode { background: var(--surface); transition: background .12s, outline-color .12s; }
.fnode:hover { background: var(--surface2); }
.fnode.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.fnode.active { background: var(--glow); }
.fnode.dynamic { outline: 1.5px dashed var(--faint); outline-offset: 2px; }
/* the kind shows as a short rule on the left edge: coral lead, green goal, amber dispatcher */
.fnode.k-lead::before, .fnode.k-goal::before, .fnode.k-parallel::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); pointer-events: none; }
.fnode.k-goal::before { background: var(--ok); }
.fnode.k-parallel::before { background: var(--warn); }
/* sockets: solid discs cut out of the canvas by a ring of its colour */
.fnode .port { width: 12px; height: 12px; background: var(--muted); outline: 3px solid var(--bg); transition: background .12s, transform .12s; }
.fnode .port.in { left: -6px; }
.fnode .port.out { right: -6px; }
.canvas.editing .fnode .port.out { background: var(--accent); }
.canvas.editing .fnode .port.out:hover { transform: translateY(-50%) scale(1.35); }
.fnode .port.branch { right: -6px; background: var(--warn); }
.fnode .port.branch.new { background: var(--warn); opacity: .45; }
.canvas.editing .fnode .port.branch:hover { opacity: 1; transform: translateY(-50%) scale(1.35); }
.fnode.drop .port.in { background: var(--ok); transform: translateY(-50%) scale(1.35); }
.fnode.nodrop .port.in { background: var(--bad); }
.fnode .brow { background: var(--bg2); }
/* links read as ink lines, as in the figures */
.canvas.flow svg.edges { color: var(--muted); }
.canvas.flow svg path.e { stroke: var(--muted); stroke-width: 1.5; }
.canvas.flow svg path.e.note { stroke: var(--faint); }
.fnode.drop { outline: 2px solid var(--ok); outline-offset: 2px; }
.fnode.nodrop { outline: 2px solid var(--bad); outline-offset: 2px; }
.elabel.sel { background: var(--glow); outline: 1.5px solid var(--accent); }
.node .rank::before { background: var(--surface2); }
.node.lead .rank::before { background: var(--accent); }
/* tables and lists: rhythm instead of rules */
.mtable { border-collapse: separate; border-spacing: 0; }
.mtable td, .mtable th { padding: 7px 10px; border: 0 !important; }
.mtable tr:nth-child(even) td { background: var(--hair); }
.mtable tr td:first-child { border-radius: 8px 0 0 8px; } .mtable tr td:last-child { border-radius: 0 8px 8px 0; }
.mitem, .fit { margin: 2px 4px; border-radius: 8px; }
.mgrp { padding: 14px 0 6px; }
.hist h6, .mgroup { background: transparent; }

// Keyed, incremental chat: only new steps are added (animated), so live

async function viewChat(main, id) {
  S.view = { kind: "chat", id };
  loadModels().catch(() => {});
  const head = h("div"), scroll = h("div", { class: "scroll" }), dock = h("div", { class: "dock" });
  const banner = h("div"), thread = h("div", { class: "thread" }), outBox = h("div", { class: "thread", style: { paddingTop: 0 } });
  scroll.append(banner, thread, outBox);
  let filesKey = "";
  main.append(head, scroll, dock);
  head.append(topbar(h("span", { class: "grow" }, sk("sk-title"))));
  const skel = h("div", { class: "thread-skel" }, sk("sk-bubble"), skLines(3), sk("sk-block"), skLines(2));
  thread.append(skel);
  const seen = new Map(); let lastActive = null, lastWaiting = null, headKey = "", first = true, goalShown = false, comp = null;
  const ctx = { run: () => S.detail.run, steps: () => S.detail.steps, edit: (text) => comp && comp.setText(text) };

  const send = guard(async (text, _v, clear) => {
    const bubble = h("div", { class: "msg-user pending enter" }, h("div", { text }));
    bubble.dataset.text = text.trim();
    const th = $("#thinking", thread); th ? thread.insertBefore(bubble, th) : thread.append(bubble);
    clear(); toBottom(scroll, true);
    try {
      const q = S.detail && pendingQuestion(S.detail.steps);
      if (q) await api(`/api/runs/${id}/answer`, { body: { seq: q.seq, text } });
      else {
        await api(`/api/runs/${id}/inject`, { body: { text } });
        if (!(S.detail && S.detail.active)) await api(`/api/runs/${id}/resume`, { body: {} });
      }
    } catch (e) { bubble.remove(); if (comp && !comp.textarea.value.trim()) comp.setText(text); throw e; } // never lose what you typed
    paint();
  });

  const paint = async () => {
    const d = S.detail = await fetchRun(id, S.detail);
    if (!S.view || S.view.id !== id) return;
    const { run, steps, active } = d;
    const wasBottom = first || nearBottom(scroll);
    const key = [active, run.status, run.cost_usd.toFixed(4), run.error, steps.length].join("|");
    if (key !== headKey) {
      headKey = key;
      head.replaceChildren(topbar(
        h("span", { class: "title grow", text: run.goal }),
        h("span", { class: "pill " + (active ? "running" : run.status) }, h("span", { class: "dot" }), active ? "working" : STATE_LABEL[runState(run)]),
        run.spec.model && h("span", { class: "pill", title: mref(run.spec.model) }, run.spec.model.provider === "acp" && icon("agent", { size: 11 }), fmtRef(run.spec.model)),
        run.verify_command && h("span", { class: "pill mono", title: "Must pass before the agent may finish: " + run.verify_command, text: "✓ " + firstLine(run.verify_command, 24) }),
        headStats(run, steps, active),
        runMenu(run, active)));
      banner.replaceChildren(run.status === "waiting" ? "" : errorBanner(run, active));
    }
    // Answered questions close their card.
    thread.querySelectorAll(".qcard.open").forEach((c) => { const q = steps.find((s) => s.seq === Number(c.dataset.seq)); if (q && answerOf(steps, q)) c.replaceWith(questionCard(run, q, steps, askerName(run, q))); });
    const fk = [steps.length, active].join("|");
    if (fk !== filesKey) {
      filesKey = fk;
      runFiles(id, true).then((files) => { if (S.view && S.view.id === id) { const atB = nearBottom(scroll); outBox.replaceChildren(outputsCard(run, files)); const b = head.querySelector(".files-n"); if (b) b.textContent = files.length ? ` ${files.length}` : ""; if (atB) toBottom(scroll); } }).catch(() => {});
    }
    thread.classList.toggle("busy", !!active);
    if (!document.hidden) markSeen(run);
    if (!goalShown) {
      skel.remove();
      const g = h("div", { class: "msg-user stepwrap" }, h("div", { text: run.goal }),
        h("div", { class: "steptools" }, h("button", { title: "Keep the goal, drop every step and reset the branch", onclick: () => rewindTo(S.detail.run, -1, { dropped: S.detail.steps.length }) }, icon("rewind", { size: 12 }), "Start over"),
          h("button", { title: "Start a separate task with this goal (e.g. another model, or a team)", onclick: () => retryAsNew(S.detail.run) }, icon("retry", { size: 12 }), "Retry as new")));
      thread.append(g); goalShown = true;
    }
    // A rewind removed steps: rebuild from scratch.
    const maxSeq = steps.length ? steps[steps.length - 1].seq : -1;
    if ([...seen.keys()].some((q) => q > maxSeq)) { seen.forEach((el) => el && el.remove()); seen.clear(); }
    let th = $("#thinking", thread);
    for (const s of steps) {
      if (seen.has(s.seq)) continue;
      if (s.kind === "inject") {
        const pend = [...thread.querySelectorAll(".msg-user.pending")].find((b) => b.dataset.text === s.output.trim());
        if (pend) { pend.classList.remove("pending"); withStepTools(pend, s, ctx); seen.set(s.seq, pend); continue; }
      }
      const el = withStepTools(chatItem(s, steps), s, ctx);
      if (el && !first) el.classList.add("enter");
      seen.set(s.seq, el);
      if (el) th ? thread.insertBefore(el, th) : thread.append(el);
    }
    if (active && !th) thread.append(thinkingRow());
    if (!active && th) th.remove();

      lastActive = active; lastWaiting = run.status === "waiting";
      const prev = dock.querySelector("textarea");
      const c = comp = composer({ placeholder: active ? "Message the agent (read on its next turn)…" : run.status === "waiting" ? "Answer the question above, or send any message…" : run.status === "done" ? "Follow up — this re-opens the task…" : "Reply to continue…", running: active, draft: id,
        onStop: guard(async () => { await api(`/api/runs/${id}/pause`, { body: {} }); toast("Pausing after the current step"); }), onSend: send });
      if (prev && prev.value) c.textarea.value = prev.value;
      dock.replaceChildren(c);
      if (first && c.textarea.value) setTimeout(() => c.textarea.dispatchEvent(new Event("input")));
      if (prev && document.activeElement === prev) c.textarea.focus();
    }
    if (wasBottom) toBottom(scroll, !first);
    first = false;
  };
  S.view.refresh = paint;
  await paint();
}

// ---------- token accounting ----------
// Input tokens (all), how many of them came from the provider's prompt
// cache, output tokens, over the given steps.
function tokenStats(steps) {
  const t = { inTok: 0, cached: 0, outTok: 0 };
  for (const s of steps) { const m = s.meta || {}; t.inTok += m.prompt_tokens || 0; t.cached += m.cache_read_tokens || 0; t.outTok += m.completion_tokens || 0; }
  t.pct = t.inTok ? Math.round((t.cached / t.inTok) * 100) : 0;
  return t;
}
const kTok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n));
const statLine = (t) => `${kTok(t.inTok)} in${t.cached ? ` (${t.pct}% cached)` : ""} · ${kTok(t.outTok)} out`;

// With a top-tier Claude lead, subordinates default to Sonnet: they do the

function suggestWorker(lead) {

  const ms = ((S.models && S.models.models) || []).filter((m) => m.provider === "claude");

  return pick ? { provider: pick.provider, model: pick.model, options: {} } : null;
}

const APPROVAL_VERB = {
  run_command: "run a command", start_process: "start a background process", stop_process: "stop a background process",
  delete_file: "delete", write_file: "write a file", edit_file: "edit a file", move_file: "move a file",
  spawn_agent: "add an agent to the flow", retire_agent: "remove an agent from the flow",
  screenshot_screen: "take a screenshot of your whole screen"

function approvalCard(runId, a) {
  if (!a) return "";

  const target = a.tool === "spawn_agent" ? `${args.name || "agent"}: ${args.task || ""}` : args.command || args.path || args.from || args.url || args.id || args.agent || args.title || "";
  let detail;
  if (a.tool === "write_file" && typeof args.content === "string") detail = args.content;
  else if (a.tool === "edit_file") detail = `--- current\n${args.old || ""}\n+++ replacement\n${args.new || ""}`;
  else detail = JSON.stringify(args, null, 2);
  if (detail.length > 20000) detail = detail.slice(0, 20000) + "\n…";
  const note = h("input", { placeholder: "Optional note for the agent (why, or what to do instead)" });
  const btns = [];

    btns.forEach((b) => (b.disabled = true));

      await api(`/api/runs/${runId}/approval`, { body: { id: a.id, allow, always, note: note.value } });

    S.view && S.view.refresh && S.view.refresh();

    h("button", { class: "ghost danger", text: "Decline", onclick: () => decide(false, false) }),
    h("button", { class: "ghost", title: `Allow this and every later ${a.tool} call in this task`, text: "Always allow", onclick: () => decide(true, true) }),
    h("button", { class: "primary", text: "Allow", onclick: () => decide(true, false) }));
  note.addEventListener("keydown", (e) => { if (e.key === "Enter" && note.value.trim()) decide(false, false); });

    h("div", { class: "row", style: { gap: "8px" } },
      icon("shield", 16, { color: "var(--warn)", flexShrink: "0" }),
      h("b", { class: "grow", text: `${who} wants to ${APPROVAL_VERB[a.tool] || "use " + a.tool}` }),

}

// Removes agents and/or the (optional) Goal; the Lead stays. One undo step.
function removeFlowNode(ed, ids) {
  const G = ed.graph;
  const gone = [].concat(ids).flatMap((id) => { const gr = (G.groups || []).find((x) => x.id === id); return gr ? gr.members : [id]; })
    .filter((id) => { const n = fnode(G, id); return n && (n.kind === "agent" || n.kind === "goal" || n.kind === "parallel"); });
  if (!gone.length) return;
  ed.push();
  for (const id of gone) {
    // Keep the flow connected: the predecessor goes straight to the successor
    // (a branch's first agent passes its branch socket on).
    const inE = G.edges.find((e) => e.to === id && isFlowEdge(G, e)), outE = outLinks(G, id)[0];
    if (inE && outE && fnode(G, id).kind !== "parallel" && !G.edges.some((e) => e.from === inE.from && e.to === outE.to)) G.edges.push(newEdge(inE.from, outE.to, !!inE.branch));
    G.edges = G.edges.filter((e) => e.from !== id && e.to !== id);
    G.nodes = G.nodes.filter((x) => x.id !== id);
  }
  if (G.groups) G.groups = G.groups.map((gr) => ({ ...gr, members: gr.members.filter((m) => !gone.includes(m)) })).filter((gr) => gr.members.length);
  ed.selected = null; if (ed.selection) ed.selection = new Set(); ed.onChange();
}

// A short text prompt. Resolves the text, or null when cancelled.
function askText({ title, label, value = "", ok = "OK", placeholder = "" }) {
  return new Promise((resolve) => {
    let done = false;
    const inp = h("input", { value, placeholder });
    const finish = (v) => { if (done) return; done = true; close(); resolve(v); };
    const close = modal(h("div", {}, h("h2", { text: title }), label && h("label", { text: label }), inp,
      h("div", { class: "actions" },
        h("button", { class: "ghost", text: "Cancel", onclick: () => finish(null) }),
        h("button", { class: "primary", text: ok, onclick: () => finish(inp.value.trim() || null) }))), { onClose: () => finish(null) });
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") finish(inp.value.trim() || null); });
    setTimeout(() => { inp.focus(); inp.select(); });
  });
}

// Right-click menu of the flow editor (`t`: the node(s), link or background).

  if (t.type === "canvas") return popMenu(null, [

    { label: "Select all", run: () => canvas.selectAll() },

  const teams = [...ed.selection].map((id) => (ed.graph.groups || []).find((x) => x.id === id)).filter(Boolean);
  const nodes = [...ed.selection].flatMap((id) => { const gr = teams.find((x) => x.id === id); return gr ? gr.members : [id]; }).map((id) => fnode(ed.graph, id)).filter(Boolean);
  const workers = nodes.filter(isWorker), agents = nodes.filter((n) => n.kind === "agent");
  const team = teams.length === 1 && ed.selection.size === 1 ? teams[0] : null;
  const cur = new Set(workers.map((w) => (notebooksOf(ed.graph, w.id)[0] || {}).id || ""));
  const same = cur.size === 1 ? [...cur][0] : null;

    const name = await askText({ title: "New notebook", label: `Shared memory for ${workers.length > 1 ? `these ${workers.length} agents` : workers[0].name}`, value: "Shared notes", ok: "Create" });
    if (!name) return;

  };
  popMenu(null, [

    team && { label: "Rename team…", run: () => renameTeam(ed, team.id) },
    team && { label: "Ungroup  (Alt+G)", run: () => ungroupTeam(ed, canvas, team.id) },
    !team && nodes.length === 1 && { label: "Edit…", run: () => ed.onEditNode(nodes[0].id) },
    !team && nodes.length > 1 && { label: `${nodes.length} selected`, disabled: true, run() {} },
    !team && agents.length > 0 && { label: agents.length > 1 ? `Make a team of ${agents.length} agents  (Ctrl+G)` : "Make a team  (Ctrl+G)", run: () => groupAgents(ed, canvas, [...ed.selection]) },
    workers.length > 0 && "-",
    ...(workers.length ? [
      { label: mark(same === "") + "No notebook", run: () => assign(null) },
      ...notebooks(ed.graph).map((nb) => ({ label: mark(same === nb.id) + "Notebook: " + nb.name, run: () => assign(nb.id) })),
      { label: mark(false) + "New notebook…", run: newNotebook }] : []),
    agents.length > 0 && "-",
    agents.length > 0 && { label: agents.length > 1 ? `Duplicate ${agents.length} agents` : "Duplicate", run: () => duplicateAgents(ed, canvas, agents.map((a) => a.id)) },
    agents.length > 0 && { label: agents.length > 1 ? `Remove ${agents.length} agents` : "Remove", danger: true, run: () => removeFlowNode(ed, agents.map((a) => a.id)) },
    nodes.length === 1 && nodes[0].kind === "goal" && "-",
    nodes.length === 1 && nodes[0].kind === "goal" && { label: "Remove Goal", danger: true, run: () => removeFlowNode(ed, nodes[0].id) },
  ], at);
}

// Copies agents with their links (between copied agents the copies link to
// each other) and their notebook, below the originals, and selects the copies.
function duplicateAgents(ed, canvas, ids) {
  const G = ed.graph, agents = ids.map((id) => fnode(G, id)).filter((n) => n && n.kind === "agent");
  if (!agents.length) return;
  ed.push();
  const map = {};
  for (const a of agents) {
    const c = structuredClone(a);
    c.id = fuid(G, a.name); c.name = a.name + " (copy)"; c.dynamic = false; c.pos = [a.pos[0] + 30, a.pos[1] + 130];
    G.nodes.push(c); map[a.id] = c.id;
  }
  for (const e of G.edges.slice()) {
    const from = map[e.from] || e.from, to = map[e.to] || e.to;
    if (from === e.from && to === e.to) continue;
    if (isFlowEdge(G, e) && !(map[e.from] && map[e.to])) continue;
    const c = { ...structuredClone(e), from, to, id: `${from}->${to}` };
    if (!G.edges.some((x) => x.id === c.id)) G.edges.push(c);
  }
  ed.onChange(); canvas.select(Object.values(map));
}
