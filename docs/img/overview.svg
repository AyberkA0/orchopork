<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .ink{fill:#231f20}
      .mute{fill:#8c8686}
      .wire{stroke:#231f20;stroke-width:1.1;fill:none}
      .edge{stroke:#231f20;stroke-width:1.25}
      .node{fill:#f7f6f3;stroke:#231f20;stroke-width:1.25}
    </style>
  </defs>
  <rect width="880" height="400" fill="#f7f6f3"/>

  <!-- caption -->
  <text class="mono mute" x="40" y="40" font-size="11">fig. 1</text>
  <text class="mono ink" x="90" y="40" font-size="11">many models, one team</text>
  <line x1="40" y1="54" x2="840" y2="54" stroke="#231f20" stroke-width="0.6"/>

  <!-- models -->
  <g class="mono ink" font-size="13">
    <text x="40" y="96">claude</text>
    <text x="40" y="126">gemini</text>
    <text x="40" y="156">deepseek</text>
    <text x="40" y="186">chatgpt</text>
    <text x="40" y="216">mistral</text>
    <text x="40" y="246">jev</text>
    <text x="40" y="276">qwen</text>
    <text x="40" y="306">llama.cpp</text>
    <text x="40" y="336">claude code</text>
  </g>
  <g class="wire">
    <path d="M150 92 H 176 C 220 92, 232 196, 270 196"/>
    <path d="M150 122 H 176 C 214 122, 232 197, 270 197"/>
    <path d="M150 152 H 176 C 208 152, 232 198, 270 198"/>
    <path d="M150 182 H 176 C 204 182, 236 199, 270 199"/>
    <path d="M150 212 H 176 C 204 212, 236 201, 270 201"/>
    <path d="M150 242 H 176 C 208 242, 232 202, 270 202"/>
    <path d="M150 272 H 176 C 214 272, 232 203, 270 203"/>
    <path d="M150 302 H 176 C 220 302, 232 204, 270 204"/>
    <path d="M150 332 H 176 C 226 332, 232 205, 270 205"/>
  </g>
  <line class="edge" x1="270" y1="200" x2="424" y2="128"/>
  <circle cx="270" cy="200" r="2.5" class="ink"/>

  <!-- graph -->
  <g class="edge">
    <line x1="440" y1="120" x2="384" y2="200"/>
    <line x1="440" y1="120" x2="508" y2="200"/>
    <line x1="384" y1="200" x2="344" y2="276"/>
    <line x1="384" y1="200" x2="412" y2="276"/>
    <line x1="508" y1="200" x2="480" y2="276"/>
    <line x1="508" y1="200" x2="548" y2="276"/>
  </g>
  <circle cx="440" cy="120" r="18" fill="#f37e8f"/>
  <circle class="node" cx="384" cy="200" r="11"/>
  <circle class="node" cx="508" cy="200" r="11"/>
  <circle class="node" cx="344" cy="276" r="7"/>
  <circle class="node" cx="412" cy="276" r="7"/>
  <circle class="node" cx="480" cy="276" r="7"/>
  <circle class="node" cx="548" cy="276" r="7"/>
  <text class="mono mute" x="466" y="116" font-size="11">lead</text>

  <text class="sans ink" x="446" y="334" font-size="18" font-weight="700" text-anchor="middle">orchopork</text>
  <text class="mono mute" x="446" y="354" font-size="11" text-anchor="middle">nodes / budget / checkpoints</text>

  <!-- outputs -->
  <g class="wire">
    <path d="M580 200 C 610 200, 610 110, 640 110"/>
    <path d="M580 200 H 640"/>
    <path d="M580 200 C 610 200, 610 290, 640 290"/>
  </g>
  <circle cx="580" cy="200" r="2.5" class="ink"/>

  <rect x="650" y="94" width="4" height="34" fill="#f37e8f"/>
  <text class="sans ink" x="666" y="108" font-size="14" font-weight="600">a branch</text>
  <text class="mono mute" x="666" y="126" font-size="11">git, reviewable</text>

  <rect x="650" y="184" width="4" height="34" fill="#f37e8f"/>
  <text class="sans ink" x="666" y="198" font-size="14" font-weight="600">numbers</text>
  <text class="mono mute" x="666" y="216" font-size="11">tokens, cache, cost, turns</text>

  <rect x="650" y="274" width="4" height="34" fill="#f37e8f"/>
  <text class="sans ink" x="666" y="288" font-size="14" font-weight="600">an answer</text>
  <text class="mono mute" x="666" y="306" font-size="11">was the team worth it?</text>
</svg>
