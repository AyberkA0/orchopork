<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L9 5L0 9" fill="none" stroke="#231f20" stroke-width="1.4"/>
    </marker>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .ink{fill:#231f20}
      .mute{fill:#8c8686}
      .rule{stroke:#231f20;stroke-width:0.6}
      .e{stroke:#231f20;stroke-width:1.25;fill:none}
      .ea{stroke:#231f20;stroke-width:1.25;fill:none;marker-end:url(#h)}
      .d{stroke:#231f20;stroke-width:1.25;fill:none;stroke-dasharray:3 4}
      .n{fill:#f7f6f3;stroke:#231f20;stroke-width:1.25}
      .p{fill:#f37e8f}
      .name{font-size:14px;font-weight:600}
      .num{font-size:11px}
      .cap{font-size:11px}
    </style>
  </defs>
  <rect width="880" height="520" fill="#f7f6f3"/>

  <!-- caption + legend -->
  <text class="mono mute" x="40" y="40" font-size="11">fig. 2</text>
  <text class="mono ink" x="90" y="40" font-size="11">orchestration patterns</text>
  <rect x="628" y="31" width="10" height="10" class="p"/>
  <text class="mono ink" x="646" y="40" font-size="11">in orchopork</text>
  <rect x="750.5" y="31.5" width="9" height="9" fill="none" stroke="#231f20"/>
  <text class="mono ink" x="768" y="40" font-size="11">planned</text>
  <line class="rule" x1="40" y1="54" x2="840" y2="54"/>
  <line class="rule" x1="40" y1="282" x2="840" y2="282"/>
  <line class="rule" x1="40" y1="510" x2="840" y2="510"/>
  <line class="rule" x1="240" y1="54" x2="240" y2="510"/>
  <line class="rule" x1="440" y1="54" x2="440" y2="510"/>
  <line class="rule" x1="640" y1="54" x2="640" y2="510"/>

  <!-- 01 hierarchy -->
  <rect x="56" y="72" width="10" height="10" class="p"/>
  <text class="mono mute num" x="74" y="81">01</text>
  <text class="sans ink name" x="96" y="82">hierarchy</text>
  <g class="e">
    <line x1="140" y1="122" x2="100" y2="176"/><line x1="140" y1="122" x2="180" y2="176"/>
    <line x1="100" y1="176" x2="76" y2="228"/><line x1="100" y1="176" x2="124" y2="228"/>
    <line x1="180" y1="176" x2="180" y2="228"/>
  </g>
  <circle class="p" cx="140" cy="122" r="12"/>
  <circle class="n" cx="100" cy="176" r="9"/><circle class="n" cx="180" cy="176" r="9"/>
  <circle class="n" cx="76" cy="228" r="6"/><circle class="n" cx="124" cy="228" r="6"/><circle class="n" cx="180" cy="228" r="6"/>
  <text class="mono mute cap" x="56" y="264">reports flow upward</text>

  <!-- 02 pipeline -->
  <rect x="256" y="72" width="10" height="10" class="p"/>
  <text class="mono mute num" x="274" y="81">02</text>
  <text class="sans ink name" x="296" y="82">pipeline</text>
  <circle class="n" cx="272" cy="160" r="8"/><circle class="p" cx="320" cy="160" r="8"/><circle class="n" cx="368" cy="160" r="8"/><circle class="n" cx="416" cy="160" r="8"/>
  <line class="ea" x1="281" y1="160" x2="309" y2="160"/><line class="ea" x1="329" y1="160" x2="357" y2="160"/><line class="ea" x1="377" y1="160" x2="405" y2="160"/>
  <path class="ea" d="M416 170 V 200 H 320 V 172"/>
  <g class="mono mute" font-size="10" text-anchor="middle">
    <text x="272" y="140">plan</text><text x="320" y="140">act</text><text x="368" y="140">verify</text><text x="416" y="140">review</text>
  </g>
  <text class="mono mute cap" x="256" y="264">loops back on failure</text>

  <!-- 03 fan-out -->
  <rect x="456" y="72" width="10" height="10" class="p"/>
  <text class="mono mute num" x="474" y="81">03</text>
  <text class="sans ink name" x="496" y="82">fan-out / fan-in</text>
  <g class="e">
    <line x1="480" y1="166" x2="534" y2="118"/><line x1="480" y1="166" x2="534" y2="166"/><line x1="480" y1="166" x2="534" y2="214"/>
    <line x1="546" y1="118" x2="600" y2="166"/><line x1="546" y1="166" x2="600" y2="166"/><line x1="546" y1="214" x2="600" y2="166"/>
  </g>
  <circle class="n" cx="480" cy="166" r="9"/>
  <circle class="n" cx="540" cy="118" r="7"/><circle class="n" cx="540" cy="166" r="7"/><circle class="n" cx="540" cy="214" r="7"/>
  <circle class="n" cx="606" cy="166" r="9" style="stroke:#f37e8f;stroke-width:2"/>
  <text class="mono mute cap" x="456" y="264">split, then merge back</text>

  <!-- 04 debate -->
  <rect x="656.5" y="72.5" width="9" height="9" fill="none" stroke="#231f20"/>
  <text class="mono mute num" x="674" y="81">04</text>
  <text class="sans ink name" x="696" y="82">debate</text>
  <circle class="n" cx="696" cy="136" r="9"/><circle class="n" cx="784" cy="136" r="9"/>
  <path class="ea" d="M706 130 Q 740 112 774 130"/><path class="ea" d="M774 143 Q 740 160 706 143"/>
  <line class="d" x1="700" y1="146" x2="736" y2="206"/><line class="d" x1="780" y1="146" x2="744" y2="206"/>
  <circle class="n" cx="740" cy="214" r="9" style="stroke:#f37e8f;stroke-width:2"/>
  <text class="mono mute" x="756" y="232" font-size="10">judge</text>
  <text class="mono mute cap" x="656" y="264">critique in rounds</text>

  <!-- 05 vote -->
  <rect x="56.5" y="300.5" width="9" height="9" fill="none" stroke="#231f20"/>
  <text class="mono mute num" x="74" y="309">05</text>
  <text class="sans ink name" x="96" y="310">ensemble / vote</text>
  <circle class="n" cx="80" cy="358" r="7"/><circle class="n" cx="116" cy="358" r="7"/><circle class="n" cx="152" cy="358" r="7"/><circle class="n" cx="188" cy="358" r="7"/>
  <g class="e">
    <line x1="80" y1="365" x2="128" y2="434"/><line x1="116" y1="365" x2="132" y2="434"/><line x1="152" y1="365" x2="140" y2="434"/><line x1="188" y1="365" x2="144" y2="434"/>
  </g>
  <rect x="120" y="434" width="32" height="16" fill="none" stroke="#f37e8f" stroke-width="2"/>
  <text class="mono mute cap" x="56" y="492">many models, one pick</text>

  <!-- 06 router -->
  <rect x="256.5" y="300.5" width="9" height="9" fill="none" stroke="#231f20"/>
  <text class="mono mute num" x="274" y="309">06</text>
  <text class="sans ink name" x="296" y="310">router</text>
  <rect x="284" y="384" width="20" height="20" transform="rotate(45 294 394)" fill="none" stroke="#f37e8f" stroke-width="2"/>
  <circle class="n" cx="404" cy="346" r="7"/><circle class="n" cx="404" cy="394" r="7"/><circle class="n" cx="404" cy="442" r="7"/>
  <line class="ea" x1="310" y1="390" x2="394" y2="350"/>
  <line class="d" x1="310" y1="394" x2="396" y2="394"/>
  <line class="d" x1="310" y1="398" x2="396" y2="438"/>
  <g class="mono mute" font-size="10"><text x="416" y="349">$</text><text x="416" y="397">$$</text><text x="416" y="445">$$$</text></g>
  <text class="mono mute cap" x="256" y="492">cheapest model that can</text>

  <!-- 07 evaluator -->
  <rect x="456.5" y="300.5" width="9" height="9" fill="none" stroke="#231f20"/>
  <text class="mono mute num" x="474" y="309">07</text>
  <text class="sans ink name" x="496" y="310">evaluator loop</text>
  <circle class="n" cx="500" cy="394" r="10"/>
  <circle class="n" cx="596" cy="394" r="10" style="stroke:#f37e8f;stroke-width:2"/>
  <path class="ea" d="M508 386 Q 548 352 588 386"/><path class="ea" d="M588 402 Q 548 436 508 402"/>
  <g class="mono mute" font-size="10" text-anchor="middle"><text x="500" y="426">maker</text><text x="596" y="426">judge</text></g>
  <text class="mono mute cap" x="456" y="492">until the bar is met</text>

  <!-- 08 blackboard -->
  <rect x="656" y="300" width="10" height="10" class="p"/>
  <text class="mono mute num" x="674" y="309">08</text>
  <text class="sans ink name" x="696" y="310">blackboard</text>
  <rect x="712" y="370" width="56" height="48" fill="none" stroke="#f37e8f" stroke-width="2"/>
  <g class="e" stroke-dasharray="2 3">
    <line x1="684" y1="352" x2="712" y2="374"/><line x1="796" y1="352" x2="768" y2="374"/>
    <line x1="684" y1="436" x2="712" y2="414"/><line x1="796" y1="436" x2="768" y2="414"/>
  </g>
  <circle class="n" cx="680" cy="348" r="7"/><circle class="n" cx="800" cy="348" r="7"/>
  <circle class="n" cx="680" cy="440" r="7"/><circle class="n" cx="800" cy="440" r="7"/>
  <text class="mono mute cap" x="656" y="492">shared worktree and reports</text>
</svg>
