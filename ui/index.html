<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchopork</title>
<style>
:root {
  --bg: #fbfaf8; --bg2: #f3f2ee; --panel: #ffffff; --line: #e4e2dc; --text: #17181a; --muted: #6e7076; --faint: #a3a5aa;
  --accent: #5b5bd6; --accent2: #0ea5a0; --accent-ink: #fff; --ok: #1a8a4a; --warn: #b26b00; --bad: #c2362b;
  --glow: rgba(91, 91, 214, .16); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.06);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0e11; --bg2: #14161a; --panel: #17191e; --line: #262930; --text: #ececf0; --muted: #9194a0; --faint: #5d606a;
    --accent: #8b8cff; --accent2: #2dd4bf; --accent-ink: #0d0e11; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --glow: rgba(139, 140, 255, .18); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14.5px/1.55 var(--sans); }
button { font: 600 13px var(--sans); cursor: pointer; border-radius: 9px; padding: 8px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
button.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { background: var(--bg2); color: var(--text); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { width: 100%; font: 13.5px var(--sans); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
textarea { resize: vertical; }
label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
.mono { font-family: var(--mono); } .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.row { display: flex; gap: 8px; align-items: center; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11px var(--sans); padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.running { color: var(--accent); border-color: var(--accent); } .pill.done { color: var(--ok); border-color: var(--ok); } .pill.paused { color: var(--warn); border-color: var(--warn); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.running .dot, .pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 50; pointer-events: none; }
.banner { display: flex; gap: 10px; align-items: center; }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 50; max-width: 80vw; box-shadow: var(--shadow); }
.toast.err { background: var(--bad); color: #fff; }

/* shell */
.shell { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
.shell.collapsed { grid-template-columns: 0 1fr; }
.side { background: var(--bg2); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.side .top { padding: 14px 12px 8px; }
.brand { font: 800 15px var(--mono); letter-spacing: -.03em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 18px; height: 18px; border-radius: 6px; background: conic-gradient(from 200deg, var(--accent), var(--accent2), var(--accent)); display: inline-block; }
.hist { flex: 1; overflow-y: auto; padding: 4px 8px; }
.hist h6 { margin: 14px 6px 4px; font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.hitem { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); }
.hitem:hover { background: var(--panel); } .hitem.sel { background: var(--panel); box-shadow: var(--shadow); }
.hitem .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hitem .ic { width: 16px; text-align: center; color: var(--muted); }
.side .foot { padding: 10px 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.meter { height: 4px; background: var(--line); border-radius: 3px; overflow: hidden; } .meter > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.main { position: relative; min-width: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 52px; }
.topbar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* home */
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 26px; }
.hero h1 { font-size: 30px; letter-spacing: -.025em; margin: 0; font-weight: 650; text-align: center; }
.hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.composer { width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 12px 10px 16px; transition: box-shadow .2s, border-color .2s; }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow), var(--shadow); }
.composer textarea { border: 0; box-shadow: none; padding: 4px 0; font-size: 15.5px; min-height: 28px; max-height: 280px; resize: none; background: transparent; }
.composer textarea:focus { box-shadow: none; }
.composer .bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.send { width: 36px; height: 36px; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--text); color: var(--bg); border: 0; font-size: 17px; }
.send.stop { background: var(--bad); color: #fff; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
.chip { font-size: 12.5px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--text); border-color: var(--faint); }
.verify-in { border: 0; border-top: 1px dashed var(--line); border-radius: 0; padding: 8px 0 2px; font: 12.5px var(--mono); box-shadow: none !important; }

/* chat */
.scroll { flex: 1; overflow-y: auto; }
.thread { width: min(780px, 100%); margin: 0 auto; padding: 8px 20px 30px; }
.msg-user { display: flex; justify-content: flex-end; margin: 18px 0; }
.msg-user > div:not(.steptools) { background: var(--bg2); border: 1px solid var(--line); padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 82%; white-space: pre-wrap; }
.msg-ai { margin: 14px 0; white-space: pre-wrap; }
.act { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 13.5px; }
.act .ic { width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center; background: var(--bg2); border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.act.fail .ic { color: var(--bad); border-color: var(--bad); }
.act .body { min-width: 0; flex: 1; }
.act .tl { color: var(--muted); } .act .tl b { color: var(--text); font-weight: 600; }
details.out summary { cursor: pointer; color: var(--faint); font-size: 12px; list-style: none; }
details.out summary::-webkit-details-marker { display: none; }
details.out pre, pre.block { background: var(--bg2); border: 1px solid var(--line); padding: 10px; border-radius: 9px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 380px; overflow: auto; margin: 6px 0 0; }
.sysline { text-align: center; font-size: 12px; color: var(--faint); margin: 16px 0; }
.thinking { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin: 14px 0; }
.dots i { display: inline-block; width: 5px; height: 5px; margin-right: 3px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
.dock { padding: 8px 20px 18px; display: flex; justify-content: center; }
.banner { width: min(780px, 100%); margin: 8px auto; border: 1px solid var(--warn); color: var(--warn); border-radius: 10px; padding: 9px 12px; font-size: 13px; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10,10,14,.42); display: grid; place-items: center; z-index: 30; padding: 16px; animation: fade .1s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: 88vh; overflow: auto; padding: 22px; animation: rise .12s ease-out; }
.modal.wide { width: min(900px, 100%); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.modal h2 { margin: 0 0 6px; font-size: 19px; letter-spacing: -.01em; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.choice button { text-align: left; padding: 14px; border-radius: 14px; font-weight: 400; display: grid; gap: 4px; }
.choice button b { font-size: 14px; } .choice button span { color: var(--muted); font-size: 12.5px; }
.choice button.hot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.orb { width: 54px; height: 54px; border-radius: 16px; margin-bottom: 12px; background: radial-gradient(circle at 30% 30%, var(--accent2), var(--accent)); box-shadow: 0 8px 30px var(--glow); }
.mlist { max-height: 340px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; }
.mitem { display: flex; gap: 10px; align-items: center; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.mitem:last-child { border-bottom: 0; } .mitem:hover { background: var(--bg2); } .mitem.sel { background: var(--glow); }
.mitem .p { font: 11px var(--mono); color: var(--muted); width: 72px; }

/* orchestra */
.orch { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
.orch.nopanel { grid-template-columns: 1fr; }
.canvas { position: relative; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; cursor: grab; touch-action: none; }
.canvas.panning { cursor: grabbing; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges path { fill: none; stroke: var(--faint); stroke-width: 1.5; }
.edges path.live { stroke: var(--accent); stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.node { position: absolute; width: 230px; min-height: 104px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; user-select: none; }
.node:hover { border-color: var(--faint); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow), var(--shadow); }
.node.drop { border-color: var(--accent2); box-shadow: 0 0 0 4px rgba(45,212,191,.25); transform: scale(1.03); }
.node.dragging { opacity: .9; z-index: 5; transition: none !important; box-shadow: 0 16px 40px rgba(0,0,0,.2); }
.node.active { border-color: var(--accent); } .node.active::after { content: ""; position: absolute; inset: -5px; border-radius: 17px; border: 2px solid var(--accent); animation: pulse 1.4s infinite; pointer-events: none; }
.node.reported { border-color: var(--ok); }
.node .rank { font: 700 10px var(--mono); letter-spacing: .06em; color: var(--accent); display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
.node .rank .chev { letter-spacing: -2px; }
.node .nm { font-weight: 650; font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .rl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .tk { font-size: 12px; color: var(--faint); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .st { position: absolute; top: 9px; right: 10px; font-size: 11px; }
.node .add { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%; padding: 0; display: none; font-size: 14px; line-height: 1; background: var(--panel); }
.node:hover .add { display: block; }
.hud { position: absolute; left: 14px; top: 14px; display: flex; gap: 6px; z-index: 3; flex-wrap: wrap; }
.hud button { background: var(--panel); box-shadow: var(--shadow); }
.reserve { position: absolute; left: 14px; bottom: 14px; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; width: 210px; }
.reserve h6 { margin: 0 0 6px; font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.tpl { padding: 6px 9px; border: 1px dashed var(--line); border-radius: 8px; font-size: 12.5px; margin-top: 5px; cursor: grab; background: var(--bg); }
.tpl:hover { border-color: var(--accent); }
.ghost-drag { position: fixed; z-index: 60; pointer-events: none; padding: 8px 12px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow); }
.deploy { position: absolute; right: 16px; bottom: 16px; z-index: 3; display: flex; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow); }
.panel { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.panel .ph { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.panel .feed { flex: 1; overflow-y: auto; padding: 8px 16px; }
.panel .pc { padding: 10px 12px 14px; border-top: 1px solid var(--line); }
.panel .pc .composer { border-radius: 14px; padding: 8px 8px 8px 12px; }
.panel .pc .composer textarea { font-size: 13.5px; }
.center { flex: 1; display: grid; place-items: center; padding: 24px; }
.stack { display: grid; gap: 12px; width: min(560px, 100%); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: rot .8s linear infinite; margin: 0 auto 12px; }
@keyframes rot { to { transform: rotate(360deg); } }
.page { flex: 1; overflow-y: auto; } .page .inner { width: min(760px, 100%); margin: 0 auto; padding: 10px 20px 60px; }
.kv { display: grid; grid-template-columns: 90px 1fr auto auto auto; gap: 8px; align-items: center; margin-top: 8px; }
/* external agents */
.ext { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 10px 0 4px; background: var(--panel); }
.ext-h { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.ext-h b { color: var(--text); }
.ext-badge { font: 700 10px var(--mono); letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
.ext ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); max-height: 220px; overflow: auto; }
.ext li { padding: 2px 0; } .ext li b { font-weight: 500; color: var(--text); }
.mgroup { padding: 8px 12px 4px; font: 600 11px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; background: var(--bg2); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.spin.sm { width: 12px; height: 12px; border-width: 2px; margin: 0 6px 0 0; display: inline-block; }
.tuner select { font-size: 12.5px; }
.addgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.addcard { text-align: left; display: grid; gap: 3px; padding: 11px 12px; border-radius: 12px; font-weight: 400; }
.addcard:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.addcard b { font-size: 13.5px; }
.conn { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 10px; align-items: center; }
.fp { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; }
.fp .crumbs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 10px; background: var(--bg2); border-bottom: 1px solid var(--line); font: 12px var(--mono); }
.fp .crumbs span { cursor: pointer; padding: 2px 4px; border-radius: 6px; } .fp .crumbs span:hover { background: var(--glow); }
.fp .dirs { max-height: 280px; overflow: auto; }
.fp .foot { display: flex; gap: 8px; align-items: center; padding: 10px; border-top: 1px solid var(--line); background: var(--bg2); }
.recent { display: grid; gap: 6px; text-align: left; }
.recent .mitem { border: 1px solid var(--line); border-radius: 10px; }
.projbtn { width: 100%; text-align: left; display: flex; gap: 8px; align-items: center; margin-top: 10px; padding: 8px 10px; }
.projbtn .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice { border: 1px solid var(--warn); border-radius: 12px; padding: 12px; margin-top: 10px; text-align: left; font-size: 13px; }
.found { display: grid; gap: 6px; }
.found .mitem { border: 1px solid var(--line); border-radius: 10px; cursor: default; }
.mitem.off { opacity: .5; cursor: default; } .mitem.off:hover { background: none; }
.agents-grid { display: grid; grid-template-columns: 150px 1fr auto auto auto; gap: 8px; align-items: center; margin-top: 10px; }
.msg-user.pending > div { opacity: .55; }
.live-line { transition: opacity .2s; }

/* skeletons: panels open instantly and shimmer until their data lands */
.sk { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--bg2) 25%, var(--line) 37%, var(--bg2) 63%); background-size: 400% 100%; animation: shimmer 1.3s ease-in-out infinite; }
.sk-line { height: 12px; margin: 8px 0; } .sk-line.w40 { width: 40%; } .sk-line.w60 { width: 60%; } .sk-line.w80 { width: 80%; }
.sk-bubble { height: 44px; width: 55%; border-radius: 16px; margin: 18px 0 18px auto; }
.sk-block { height: 64px; margin: 12px 0; border-radius: 12px; }
.sk-row { height: 38px; margin: 6px 0; border-radius: 10px; }
.sk-title { height: 16px; width: 45%; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* motion */
@media (prefers-reduced-motion: no-preference) {
  .shell { transition: grid-template-columns .2s cubic-bezier(.2,.8,.2,1); }
  .enter { animation: enter .18s cubic-bezier(.2,.8,.2,1) both; }
  .node { transition: left .28s cubic-bezier(.2,.8,.2,1), top .28s cubic-bezier(.2,.8,.2,1), box-shadow .15s, border-color .15s, transform .12s, opacity .15s; }
  .node.noanim { transition: none; }
  .node.leaving { opacity: 0; transform: scale(.94); }
  .node.born { animation: pop .35s cubic-bezier(.2,.8,.2,1) both; }
  .edges path { transition: d .28s cubic-bezier(.2,.8,.2,1), stroke .15s; }
  .stage.smooth { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  button { transition: transform .08s, background .15s, color .15s, border-color .15s, box-shadow .15s, opacity .15s; }
  button:active:not(:disabled) { transform: scale(.97); }
  .hitem { transition: background .15s, box-shadow .15s, transform .15s; }
  .hitem:active { transform: scale(.99); }
  .toast { animation: toastIn .26s cubic-bezier(.2,.8,.2,1) both; }
  .toast.out { animation: toastOut .2s ease-in forwards; }
  .scrim.out { animation: fadeOut .1s ease-in forwards; }
  .scrim.out .modal { animation: sink .1s ease-in forwards; }
  .live-line.swap { opacity: 0; }
  .pill { transition: color .25s, border-color .25s; }
  .meter > div { transition: width .6s cubic-bezier(.2,.8,.2,1); }
}
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
@keyframes pop { from { opacity: 0; transform: scale(.9); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes sink { to { opacity: 0; transform: translateY(6px) scale(.98); } }
/* sidebar: search, sections, per-run status */
.sfind { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.sfind input { padding: 6px 9px; font-size: 12.5px; background: var(--panel); }
.kbd { font: 600 10.5px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--panel); white-space: nowrap; }

    }).catch((e) => box.replaceChildren(h("div", { class: "small bad", text: e.message })));
  } else if (efforts && efforts.length) {

  const limits = h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 12px" } },
    lim("steps_per_session", "Steps before pausing for a check"), lim("max_failures", "Failed turns before pausing"),
    lim("escalate_after", "Failed turns before escalating"), lim("command_timeout_secs", "Command timeout (s)"),
    lim("max_output_tokens", "Max output tokens per call"), lim("local_context_chars", "Local context budget (chars)"));
  const esc = h("input", { value: mref(cfg.routing.escalation), placeholder: "e.g. claude:claude-sonnet-5 (optional)", class: "mono" });
  const def = h("input", { value: mref(cfg.routing.actor), placeholder: "e.g. ollama:qwen2.5-coder:14b (optional)", class: "mono" });
  const parseRef = (v) => { v = v.trim(); if (!v) return null; const i = v.indexOf(":"); return i < 0 ? null : { provider: v.slice(0, i), model: v.slice(i + 1) }; };

  const skills = h("div");
  let saveRow;
  S.settingsDirty = false;
  const paintSkills = (list, errors) => skills.replaceChildren(...list.map((s) => h("label", { class: "row", style: { color: "var(--text)", fontSize: "13.5px", alignItems: "flex-start", gap: "10px" } },
    h("input", { type: "checkbox", style: { width: "auto", marginTop: "4px" }, checked: s.enabled, onchange: guard(async (e) => { try { await api("/api/skills/toggle", { body: { name: s.name, on: e.target.checked } }); } catch (x) { e.target.checked = !e.target.checked; throw x; } }) }),
    h("span", {}, h("b", { text: s.name }), " ", h("span", { class: "pill", text: s.type.replace("_", " ") }), h("div", { class: "small muted", text: s.description })))),
    ...(errors || []).map((x) => h("div", { class: "small bad", text: `${x.path}: ${x.error}` })));
  paintSkills(ws.skills, ws.skill_errors);

  // External agents (ACP): name + launch command, availability and a live handshake test.
  // Availability fills in when the (possibly slow) model scan returns.
  let avail = Object.fromEntries(((S.models && S.models.agents) || []).map((a) => [a.model, a.available]));
  const modelsReady = loadModels(true).catch(() => ({ models: [], agents: [], notes: [] }));
  let extAgents = structuredClone(cfg.external_agents || []);
  const agentsBox = h("div");
  const paintAgents = () => agentsBox.replaceChildren(h("div", { class: "agents-grid" }, extAgents.map((a, i) => {
    const name = h("input", { value: a.name, oninput: (e) => (a.name = e.target.value) });
    const cmd = h("input", { class: "mono", value: [a.command, ...a.args].join(" "), title: "Command that starts the agent in ACP mode",
      oninput: (e) => { const parts = e.target.value.trim().split(/\s+/); a.command = parts[0] || ""; a.args = parts.slice(1); } });
    const known = a.id in avail;
    const out = h("span", { class: "small " + (avail[a.id] ? "ok" : "faint"), text: avail[a.id] ? "✓ found" : avail[a.id] === false ? "not installed" : S.models ? "unsaved" : "checking…" });
    void known;
    return [name, cmd,
      h("button", { text: "Test", title: "Start it and run the ACP handshake (save first)", onclick: guard(async (e) => {
        e.target.disabled = true; out.textContent = "starting…"; out.className = "small muted";
        try { const r = await api("/api/agents/probe", { body: { id: a.id } }); const i = r.info.agentInfo || {}; out.textContent = `✓ ${i.title || i.name || "ok"} ${i.version || ""}`; out.className = "small ok"; }
        catch (x) { out.textContent = x.message; out.className = "small bad"; } finally { e.target.disabled = false; }
      }) }),
      h("button", { class: "ghost", text: "✕", title: "Remove", onclick: () => { extAgents.splice(i, 1); paintAgents(); } }),
      out];
  })));
  paintAgents();
  const agentsCard = h("details", { class: "card" }, h("summary", { style: { cursor: "pointer" } }, h("b", { text: "Agent launch commands (advanced)" })),
    h("p", { class: "small muted", style: { margin: 0 }, text: "Claude Code, Gemini CLI, Codex and any other ACP agent can do whole tasks — alone or as members of an orchestra. They use your own login for that tool; their cost is not counted against the budget." }),
    agentsBox,
    h("div", { class: "row", style: { marginTop: "10px" } }, h("button", { class: "ghost", text: "＋ Add agent", onclick: () => {
      const id = uid(extAgents.map((x) => ({ id: x.id })), "agent"); extAgents.push({ id, name: "New agent", command: "", args: [] }); paintAgents();
    } })));

  // Connections: everything that provides models, with one "Add a model" entry point.
  const connBox = h("div", { class: "conn", style: { marginTop: "12px" } }), notesBox = h("div");
  connBox.append(...Array.from({ length: 3 }, () => [h("div", {}, sk("sk-line w40"), sk("sk-line w60")), sk("sk-line"), h("span")]).flat());
  const fillConn = (data) => {
    // Fresh state (not the cached one the page opened with): models added
    // elsewhere must show up here.
    const cfg = S.state.workspace.config, pv = Object.fromEntries(S.state.workspace.providers.map((p) => [p.id, p]));
    const count = (pred) => data.models.filter(pred).length;
    const rows = [];
    const row = (title, detail, ok, remove) => rows.push(h("div", {}, h("b", { text: title }), h("div", { class: "small " + (ok ? "muted" : "warn"), text: detail })),
      h("span", { class: "pill " + (ok ? "done" : ""), text: ok ? "connected" : "check" }),
      remove ? h("button", { class: "ghost", text: "Remove", onclick: guard(async () => { if (!(await confirmBox({ title: `Remove ${title}?`, text: "Its models disappear from the pickers. Agents already set to use them will fail until you pick another model.", ok: "Remove", danger: true }))) return; await api("/api/models/remove", { body: remove }); S.models = null; route(); }) }) : h("span"));
    const nOllama = count((m) => m.provider === "ollama");
    row("Ollama", `${cfg.ollama_url} · ${nOllama ? nOllama + " models" : "not reachable or no models"}`, nOllama > 0, null);
    if (cfg.llamacpp_url) row("llama.cpp", cfg.llamacpp_url, count((m) => m.provider === "llamacpp") > 0, null);
    for (const p of ["claude", "gemini", "deepseek"]) if (pv[p] && pv[p].configured) row(p[0].toUpperCase() + p.slice(1), `${count((m) => m.provider === p)} models · API key stored`, true, { kind: "cloud", provider: p });
    for (const e of cfg.endpoints || []) row(e.name, `${e.base_url}${e.local ? " · local" : ""} · ${count((m) => m.provider === "compat" && m.model.startsWith(e.id + "/"))} models`, count((m) => m.model.startsWith(e.id + "/")) > 0, { kind: "endpoint", id: e.id });
    for (const a of data.agents || []) rows.push(h("div", {}, h("b", { text: a.name }), h("div", { class: "small muted", text: a.available ? "ACP agent · uses your login" : "not installed" })),
      h("span", { class: "pill " + (a.available ? "done" : ""), text: a.available ? "ready" : "—" }),
      a.available ? h("span") : h("button", { class: "ghost", text: "Set up", onclick: async () => { await openAddModel(); S.models = null; route(); } }));
    connBox.replaceChildren(...rows);
    connBox.classList.add("enter");
    notesBox.replaceChildren(data.notes.length > 0 ? h("div", { class: "small warn", style: { marginTop: "8px" }, text: data.notes.join(" · ") }) : "");
  };
  Promise.all([modelsReady, loadState().catch(() => {})]).then(([data]) => {
    if (!document.body.contains(connBox)) return;
    fillConn(data);
    avail = Object.fromEntries((data.agents || []).map((a) => [a.model, a.available]));
    paintAgents();
  });
  const connCard = h("div", { class: "card" },
    h("div", { class: "row" }, h("h3", { class: "grow", style: { margin: 0 }, text: "Models" }),
      h("button", { class: "accent", text: "＋ Add a model", onclick: async () => { await openAddModel(); S.models = null; route(); } })),
    connBox, notesBox);

  inner.append(
    connCard,
    h("div", { class: "card" }, h("h3", { text: "Local tuning" }), h("label", { text: "Ollama context window (num_ctx, tokens)" }), numCtx),
    agentsCard,
    h("div", { class: "card" }, h("h3", { text: "Budget & routing" }),
      h("label", { text: "Monthly cloud cap (USD) — calls that could exceed it are refused before they are sent" }), cap,
      h("label", { text: "Escalation model — takes over a turn after repeated failures" }), esc,
      h("label", { text: "Default model for the CLI" }), def),
    h("div", { class: "card" }, h("h3", { text: "Safety" }), limits,
      h("label", { class: "row", style: { color: "var(--text)", marginTop: "14px" } }, allow, "Allow agents to run shell commands")),
    h("div", { class: "card" }, h("div", { class: "row" }, h("h3", { class: "grow", text: "Skills" }),
      h("button", { class: "ghost", text: "Reload", onclick: guard(async () => { const r = await api("/api/skills/reload", { body: {} }); paintSkills(r.skills, r.errors); }) })), skills),
    saveRow = h("div", { class: "row", style: { position: "sticky", bottom: "12px", background: "var(--panel)", border: "1px solid var(--line)", borderRadius: "14px", padding: "8px 8px 8px 14px", boxShadow: "var(--shadow)" } },
      h("span", { class: "grow small muted", text: "Changes here are saved when you press Save." }),
      h("button", { class: "primary", text: "Save settings", onclick: guard(async () => {
        const fresh = (await api("/api/state")).workspace.config; // keep models added since the page opened
        const next = { ...fresh, monthly_cap_usd: Number(cap.value), ollama_num_ctx: Number(numCtx.value),
          routing: { ...fresh.routing, escalation: parseRef(esc.value), actor: parseRef(def.value) }, limits: { ...fresh.limits, allow_commands: allow.checked } };
        limits.querySelectorAll("input[data-k]").forEach((i) => { next.limits[i.dataset.k] = Number(i.value); });
        next.external_agents = extAgents.filter((a) => a.command.trim());
        await api("/api/config", { method: "PUT", body: next }); S.models = null; toast("Saved");
        setDirty(false);
      }) })));
  // Unsaved edits are flagged, and leaving the page asks first.
  const setDirty = (v) => {
    S.settingsDirty = v;
    saveRow.firstChild.textContent = v ? "● Unsaved changes" : "Changes here are saved when you press Save.";
    saveRow.firstChild.className = "grow small " + (v ? "warn" : "muted");
  };
  inner.addEventListener("input", (e) => { if (!skills.contains(e.target)) setDirty(true); });
  inner.addEventListener("change", (e) => { if (!skills.contains(e.target)) setDirty(true); });
  S.view.leave = () => !S.settingsDirty || confirm("Leave without saving your settings changes?");
}

// ---------- command palette (Ctrl/⌘ K): jump to any conversation, project or action ----------
function palette() {
  if ($(".pal")) return;
  const ws = S.state && S.state.workspace; if (!ws) return;
  const od = pget("orchDraft", null);
  const actions = [
    { g: "Actions", ic: "＋", t: "New chat", k: "", run: () => go("#/") },
    od && { g: "Actions", ic: "⎇", t: "Continue the unfinished team: " + firstLine(od.goal, 60), run: () => go("#/o/new") },
    { g: "Actions", ic: "⚙", t: "Models & settings", run: () => go("#/models") },
    { g: "Actions", ic: "⇅", t: "Switch project…", run: switchProject },
    { g: "Actions", ic: "⟨", t: "Toggle sidebar", run: () => toggleSide() },
  ].filter(Boolean);
  const seen = seenMap();
  const runs = [...(S.runs || [])].sort((a, b) => (b.status === "running") - (a.status === "running") || isUnread(b, seen) - isUnread(a, seen) || b.updated_at - a.updated_at)
    .map((r) => ({ g: "Conversations", dot: runState(r), ic: r.spec.mode === "orchestra" ? "⎇" : "›", t: r.goal, k: `${STATE_LABEL[runState(r)]} · ${ago(r.updated_at)}`, extra: r.branch, run: () => go(runHash(r)) }));
  const projects = recents().filter((p) => p !== ws.root).map((p) => ({ g: "Projects", ic: "▣", t: baseName(p), k: p, run: guard(async () => { if (!(await openProject(p, h("div")))) switchProject(); }) }));
  const all = [...actions, ...runs, ...projects];
  const q = h("input", { placeholder: "Jump to a conversation, project or action…" });
  const res = h("div", { class: "res" });
  let items = [], on = 0;
  const paint = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    items = all.filter((it) => { const hay = (it.t + " " + (it.k || "") + " " + (it.extra || "")).toLowerCase(); return words.every((w) => hay.includes(w)); });
    if (!words.length) items = [...actions, ...runs.slice(0, 8), ...projects];
    on = Math.min(on, Math.max(0, items.length - 1));
    const kids = []; let g = null;
    items.slice(0, 60).forEach((it, i) => {
      if (it.g !== g) { g = it.g; kids.push(h("div", { class: "grp", text: g })); }
      kids.push(h("div", { class: "it" + (i === on ? " on" : ""), onmousemove: () => { if (on !== i) { on = i; paint(); } }, onclick: () => pick(i) },
        it.dot ? h("span", { class: "sdot " + it.dot, style: { width: "7px", height: "7px", borderRadius: "50%", flex: "none" } }) : null,
        h("span", { class: "faint", style: { width: "14px", textAlign: "center" }, text: it.ic }), h("span", { class: "t", text: it.t }), it.k && h("span", { class: "k", text: it.k })));
    });
    res.replaceChildren(...(kids.length ? kids : [h("div", { class: "it faint", text: "Nothing matches." })]));
    res.querySelector(".it.on")?.scrollIntoView({ block: "nearest" });
  };
  const pick = (i) => { const it = items[i]; if (!it) return; close(); it.run(); };
  q.addEventListener("input", () => { on = 0; paint(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); on = Math.min(items.length - 1, on + 1); paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); on = Math.max(0, on - 1); paint(); }
    else if (e.key === "Enter") { e.preventDefault(); pick(on); }
  });
  const close = modal(h("div", {}, q, res, h("div", { class: "hint" }, h("span", { text: "↑↓ move" }), h("span", { text: "↵ open" }), h("span", { text: "esc close" }), h("span", { class: "grow" }), h("span", { text: baseName(ws.root) }))), { cls: "pal" });
  paint(); setTimeout(() => q.focus());
}
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") { e.preventDefault(); palette(); }
});
// Coming back to the tab counts as looking at the open conversation.
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.detail && S.view && S.view.id === S.detail.run.id) markSeen(S.detail.run); });

// ---------- live events ----------
let refetchT = null;
function connectEvents() {
  if (S.es) return;
  S.es = new EventSource("/api/events");
  S.es.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    const runId = ev.run ? ev.run.id : ev.step ? ev.step.run_id : ev.run_id;
    if (ev.kind === "log") { if (S.view && S.view.id === runId) setLive(ev.message); return; }
    if (ev.kind === "run" && S.runs) {
      const i = S.runs.findIndex((r) => r.id === ev.run.id);
      if (i >= 0) { const before = S.runs[i]; S.runs[i] = ev.run; announce(before, ev.run); }
    }
    if (S.view && S.view.id === runId && S.view.refresh) { clearTimeout(refetchT); refetchT = setTimeout(() => S.view.refresh().catch(() => {}), 120); }
    if (ev.kind === "run" || ev.kind === "deleted") refreshSide();
  };
  S.es.onerror = () => { S.es.close(); S.es = null; setTimeout(connectEvents, 2000); };
}
// A task you are not looking at finished or stopped: say so, with a way to
// jump there. Desktop notification too, if the tab is in the background.
function announce(before, run) {
  if (before.status !== "running" || run.status === "running") return;
  const watching = S.view && S.view.id === run.id && !document.hidden;
  if (watching) return;
  const st = runState(run);
  const msg = (st === "done" ? "✓ Finished: " : st === "error" ? "⚠ Stopped: " : "⏸ Paused: ") + firstLine(run.goal, 60);
  if (!(S.view && S.view.id === run.id)) toast(msg, false, { label: "Open", run: () => go(runHash(run)) });
  if (document.hidden && store.get("notify", false) && "Notification" in window && Notification.permission === "granted") {
    try {
      const n = new Notification(msg, { body: (run.error ? firstLine(run.error, 140) + "\n" : "") + baseName(wsKey()), tag: run.id });
      n.onclick = () => { window.focus(); go(runHash(run)); n.close(); };
    } catch {}
  }
}
let sideT = null;
function refreshSide() {
  clearTimeout(sideT);
  sideT = setTimeout(async () => {
    try {
      await loadState(); await loadRuns();
      replaceSide();
      if (S.view && S.view.kind === "home") S.view.refresh();
    } catch {}
  }, 250);
}

route();
