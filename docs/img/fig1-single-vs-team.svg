<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L9 5L0 9" fill="none" stroke="#231f20" stroke-width="1.4"/>
    </marker>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .ink{fill:#231f20}
      .mute{fill:#8c8686}
      .e{stroke:#231f20;stroke-width:1.25;fill:none}
      .ea{stroke:#231f20;stroke-width:1.25;fill:none;marker-end:url(#h)}
      .n{fill:#f7f6f3;stroke:#231f20;stroke-width:1.25}
      .rule{stroke:#231f20;stroke-width:0.6}
      .lbl{font-size:11px}
    </style>
  </defs>
  <rect width="880" height="440" fill="#f7f6f3"/>

  <!-- caption -->
  <text class="mono mute" x="40" y="40" font-size="11">fig. 1</text>
  <text class="mono ink" x="90" y="40" font-size="11">one goal, run alone and as a team of different models, measured the same way</text>
  <line class="rule" x1="40" y1="54" x2="840" y2="54"/>

  <!-- goal -->
  <rect x="40" y="212" width="104" height="56" fill="none" stroke="#231f20" stroke-width="1.25"/>
  <text class="sans ink" x="56" y="237" font-size="15" font-weight="700">goal</text>
  <text class="mono mute lbl" x="56" y="255">same task</text>
  <path class="ea" d="M144 232 C 176 232, 176 130, 214 130"/>
  <path class="ea" d="M144 248 C 176 248, 176 262, 290 262"/>

  <!-- lane a: single agent -->
  <text class="mono mute lbl" x="214" y="96">a</text>
  <text class="mono ink lbl" x="230" y="96">single agent</text>
  <circle class="n" cx="226" cy="130" r="11"/>
  <text class="mono ink lbl" x="244" y="134">claude</text>
  <path class="ea" d="M300 130 H 540"/>

  <!-- lane b: orchestra -->
  <text class="mono mute lbl" x="214" y="196">b</text>
  <text class="mono ink lbl" x="230" y="196">orchestra</text>
  <g class="e">
    <line x1="302" y1="262" x2="252" y2="326"/>
    <line x1="302" y1="262" x2="372" y2="326"/>
    <line x1="252" y1="326" x2="226" y2="386"/>
    <line x1="252" y1="326" x2="290" y2="386"/>
    <line x1="372" y1="326" x2="372" y2="386"/>
  </g>
  <circle cx="302" cy="262" r="13" fill="#f37e8f"/>
  <circle class="n" cx="252" cy="326" r="9"/>
  <circle class="n" cx="372" cy="326" r="9"/>
  <circle class="n" cx="226" cy="386" r="7"/>
  <circle class="n" cx="290" cy="386" r="7"/>
  <circle class="n" cx="372" cy="386" r="7"/>
  <g class="mono lbl">
    <text class="ink" x="322" y="258">claude</text><text class="mute" x="322" y="272">lead</text>
    <text class="ink" x="236" y="322" text-anchor="end">qwen</text><text class="mute" x="236" y="336" text-anchor="end">local</text>
    <text class="ink" x="388" y="322">deepseek</text>
    <text class="ink" x="226" y="410" text-anchor="middle">mistral</text>
    <text class="ink" x="290" y="410" text-anchor="middle">jev</text>
    <text class="ink" x="372" y="410" text-anchor="middle">gemini</text>
  </g>
  <path class="ea" d="M400 262 H 540"/>

  <!-- measurement panel -->
  <line class="rule" x1="556" y1="80" x2="556" y2="412"/>
  <text class="sans ink" x="576" y="98" font-size="15" font-weight="700">measured</text>
  <rect x="690" y="88" width="10" height="10" fill="none" stroke="#231f20"/>
  <text class="mono ink lbl" x="706" y="97">a</text>
  <rect x="730" y="88" width="10" height="10" fill="#f37e8f"/>
  <text class="mono ink lbl" x="746" y="97">b</text>

  <g class="mono lbl">
    <text class="ink" x="576" y="140">tokens</text>
    <rect x="660" y="130" width="120" height="7" fill="none" stroke="#231f20"/>
    <rect x="660" y="141" width="164" height="7" fill="#f37e8f"/>

    <text class="ink" x="576" y="190">cost</text>
    <rect x="660" y="180" width="150" height="7" fill="none" stroke="#231f20"/>
    <rect x="660" y="191" width="92" height="7" fill="#f37e8f"/>

    <text class="ink" x="576" y="240">time</text>
    <rect x="660" y="230" width="128" height="7" fill="none" stroke="#231f20"/>
    <rect x="660" y="241" width="110" height="7" fill="#f37e8f"/>

    <text class="ink" x="576" y="290">turns</text>
    <rect x="660" y="280" width="96" height="7" fill="none" stroke="#231f20"/>
    <rect x="660" y="291" width="140" height="7" fill="#f37e8f"/>

    <text class="ink" x="576" y="340">outcome</text>
    <text class="mute" x="660" y="340">tests, review, diff</text>
  </g>

  <line class="rule" x1="576" y1="366" x2="840" y2="366"/>
  <text class="sans ink" x="576" y="392" font-size="14" font-weight="600">was the team worth it?</text>
  <text class="mono mute lbl" x="576" y="410">answered with numbers, not impressions</text>
</svg>
