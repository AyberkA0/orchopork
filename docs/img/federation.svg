<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="330" rx="14" fill="#f7f6f3"/>
  <defs>
    <style>
      .srv{fill:#ffffff;stroke:#d8d5ce}
      .core{fill:#1f1e1c}
      .t{font-size:14px;font-weight:600;fill:#1f1e1c}
      .tw{font-size:14px;font-weight:700;fill:#f7f6f3}
      .s{font-size:11px;fill:#8a8882}
      .sw{font-size:11px;fill:#b9b6ae}
      .link{stroke:#c9a46b;stroke-width:1.8;stroke-dasharray:6 5;fill:none}
      .chip{fill:#efe7d8;stroke:#c9a46b}
      .ct{font-size:11px;fill:#5a4a2c}
    </style>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#6b6a66" letter-spacing="1">FINAL GOAL: ORCHOPORK INSTANCES ORCHESTRATING EACH OTHER</text>

  <!-- links -->
  <path class="link" d="M340 170 L 228 108"/>
  <path class="link" d="M340 190 L 228 250"/>
  <path class="link" d="M540 170 L 652 108"/>
  <path class="link" d="M540 190 L 652 250"/>

  <!-- coordinator -->
  <rect class="core" x="340" y="130" width="200" height="100" rx="12"/>
  <text class="tw" x="440" y="166" text-anchor="middle">orchopork</text>
  <text class="sw" x="440" y="186" text-anchor="middle">coordinator</text>
  <text class="sw" x="440" y="206" text-anchor="middle">plans across machines</text>

  <!-- servers -->
  <g>
    <rect class="srv" x="40" y="56" width="188" height="100" rx="10"/>
    <text class="t" x="56" y="82">GPU server A</text>
    <text class="s" x="56" y="100">orchopork node</text>
    <rect class="chip" x="56" y="114" width="70" height="24" rx="5"/><text class="ct" x="91" y="130" text-anchor="middle">qwen 32b</text>
    <rect class="chip" x="134" y="114" width="78" height="24" rx="5"/><text class="ct" x="173" y="130" text-anchor="middle">deepseek</text>
  </g>
  <g>
    <rect class="srv" x="40" y="204" width="188" height="100" rx="10"/>
    <text class="t" x="56" y="230">Workstation</text>
    <text class="s" x="56" y="248">orchopork node</text>
    <rect class="chip" x="56" y="262" width="70" height="24" rx="5"/><text class="ct" x="91" y="278" text-anchor="middle">mistral</text>
    <rect class="chip" x="134" y="262" width="78" height="24" rx="5"/><text class="ct" x="173" y="278" text-anchor="middle">llama.cpp</text>
  </g>
  <g>
    <rect class="srv" x="652" y="56" width="188" height="100" rx="10"/>
    <text class="t" x="668" y="82">Cloud VM</text>
    <text class="s" x="668" y="100">orchopork node</text>
    <rect class="chip" x="668" y="114" width="70" height="24" rx="5"/><text class="ct" x="703" y="130" text-anchor="middle">claude</text>
    <rect class="chip" x="746" y="114" width="78" height="24" rx="5"/><text class="ct" x="785" y="130" text-anchor="middle">gemini</text>
  </g>
  <g>
    <rect class="srv" x="652" y="204" width="188" height="100" rx="10"/>
    <text class="t" x="668" y="230">Laptop</text>
    <text class="s" x="668" y="248">orchopork node</text>
    <rect class="chip" x="668" y="262" width="86" height="24" rx="5"/><text class="ct" x="711" y="278" text-anchor="middle">claude code</text>
    <rect class="chip" x="762" y="262" width="62" height="24" rx="5"/><text class="ct" x="793" y="278" text-anchor="middle">codex</text>
  </g>
</svg>
