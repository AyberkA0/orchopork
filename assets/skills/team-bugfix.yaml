name: "team-bugfix"
version: "1.0.0"
type: "team_template"
description: "Fixing a reported bug: reproduce it with a failing test, fix the cause, prove the fix."
team:
  - id: lead
    name: Lead
    role: owns the outcome; integrates and reviews
    task: "Make sure the reported bug is reproduced, fixed at its cause, and covered by a test. Review the reports and diffs, send work back when the cause is only papered over, then finish."
    done_when: "The reproduction test fails before the fix and passes after it, and the relevant suite passes."
  - id: reproducer
    name: Reproducer
    role: turns the report into a failing test
    parent: lead
    task: "Find where the bug lives and write the smallest test that fails for exactly the reported reason. Do not fix the bug. Report the test's name, how to run it, and the suspected cause with file and line."
    done_when: "A new test fails for the reported reason, and nothing else changed."
  - id: fixer
    name: Fixer
    role: fixes the cause
    parent: lead
    task: "Using the reproducer's report, fix the cause with the smallest change that makes its test pass without breaking others. Do not weaken or delete the test."
    done_when: "The reproduction test and the surrounding tests pass."
