[package]
name = "orchopork"
version = "0.1.0"
edition = "2024"
# File::try_lock (engine lock) and let-chains.
rust-version = "1.89"
description = "Lean hybrid local/cloud LLM agent orchestration engine"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# The SPA is one embedded file (ui/index.html via include_str!), so no
# bundler or an include_dir-style multi-file embed is needed.

# Git is driven through hardened `tokio::process::Command` calls (see src/git),
# which avoids a libgit2/C-toolchain requirement on Windows and gives us
# `git worktree` for free.

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
