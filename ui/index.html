  };
  close = modal(h("div", {},
    h("h2", { text: "Shared notebooks" }),
    h("p", { class: "small muted", style: { marginTop: 0 }, text: readOnly
      ? "What the agents wrote for each other in this run."
      : "A notebook is shared memory for the agents that use it, for this run only: they leave each other notes (decisions, interfaces, pitfalls). Pick an agent's notebook in its dialog (double-click the agent) or from its right-click menu." }),
    list,
    h("div", { class: "actions" },
      !readOnly && h("button", { class: "ghost", text: "＋ New notebook", onclick: () => {
        rows.push({ id: null, name: "Shared notes", task: "", gone: false }); paint();
        const inputs = list.querySelectorAll("input"); if (inputs.length) inputs[inputs.length - 1].select();
      } }),

        : [h("button", { class: "ghost", text: "Cancel", onclick: () => close() }), h("button", { class: "primary", text: "Save", onclick: save })])), { wide: true });
  paint();
}

// Right-click menu of the flow editor (`t`: the node(s), link or background).
function editorMenu(ed, canvas, t, e, arrange) {
  const at = { x: e.clientX, y: e.clientY };
  if (t.type === "edge") return popMenu(null, [
    { label: "Edit link…", run: () => ed.onEditEdge(t.id) },
    { label: "Remove link", danger: true, run: () => { ed.push(); ed.graph.edges = ed.graph.edges.filter((x) => x.id !== t.id); ed.selected = null; ed.onChange(); } }], at);
  if (t.type === "canvas") return popMenu(null, [
    { label: "＋ Add agent here", run: () => canvas.addNode("agent", null, [Math.round(t.at[0] - FW / 2), Math.round(t.at[1] - 30)]) },
    { label: "⑂ Add dispatcher here", run: () => canvas.addNode("parallel", null, [Math.round(t.at[0] - FW / 2), Math.round(t.at[1] - 30)]) },
    !ed.graph.nodes.some((n) => n.kind === "goal") && { label: [icon("flag", 12), " Add Goal here"], run: () => canvas.addNode("goal", null, [Math.round(t.at[0] - FW / 2), Math.round(t.at[1] - 30)]) },
    { label: "Notebooks…", run: () => notebooksWindow(ed) },
    "-",
    { label: "Select all", run: () => canvas.selectAll() },
    { label: "Arrange left to right", run: arrange },
    { label: "Fit to screen", run: () => canvas.fit() }], at);
  const teams = [...ed.selection].map((id) => (ed.graph.groups || []).find((x) => x.id === id)).filter(Boolean);
  const nodes = [...ed.selection].flatMap((id) => { const gr = teams.find((x) => x.id === id); return gr ? gr.members : [id]; }).map((id) => fnode(ed.graph, id)).filter(Boolean);
  const workers = nodes.filter(isWorker), agents = nodes.filter((n) => n.kind === "agent");
  const team = teams.length === 1 && ed.selection.size === 1 ? teams[0] : null;
  const cur = new Set(workers.map((w) => (notebooksOf(ed.graph, w.id)[0] || {}).id || ""));
  const same = cur.size === 1 ? [...cur][0] : null;
  const mark = (on) => (on ? "✓ " : "  ");
  const assign = (id) => { ed.push(); for (const w of workers) setNotebook(ed.graph, w.id, id); ed.onChange(); };
  const newNotebook = async () => {
    const name = await askText({ title: "New notebook", label: `Shared memory for ${workers.length > 1 ? `these ${workers.length} agents` : workers[0].name}`, value: "Shared notes", ok: "Create" });
    if (!name) return;
    ed.push(); const id = addNotebook(ed.graph, name, ""); for (const w of workers) setNotebook(ed.graph, w.id, id); ed.onChange();
  };
  popMenu(null, [
    team && { label: "Open team  (Tab)", run: () => canvas.toggleGroup(team.id) },
    team && { label: "Rename team…", run: () => renameTeam(ed, team.id) },
    team && { label: "Ungroup  (Alt+G)", run: () => ungroupTeam(ed, canvas, team.id) },
    !team && nodes.length === 1 && { label: "Edit…", run: () => ed.onEditNode(nodes[0].id) },
    !team && nodes.length > 1 && { label: `${nodes.length} selected`, disabled: true, run() {} },
    !team && agents.length > 0 && { label: agents.length > 1 ? `Make a team of ${agents.length} agents  (Ctrl+G)` : "Make a team  (Ctrl+G)", run: () => groupAgents(ed, canvas, [...ed.selection]) },
    workers.length > 0 && "-",
    ...(workers.length ? [
      { label: mark(same === "") + "No notebook", run: () => assign(null) },
      ...notebooks(ed.graph).map((nb) => ({ label: mark(same === nb.id) + "Notebook: " + nb.name, run: () => assign(nb.id) })),
      { label: mark(false) + "New notebook…", run: newNotebook }] : []),
    agents.length > 0 && "-",
    agents.length > 0 && { label: agents.length > 1 ? `Duplicate ${agents.length} agents` : "Duplicate", run: () => duplicateAgents(ed, canvas, agents.map((a) => a.id)) },
    agents.length > 0 && { label: agents.length > 1 ? `Remove ${agents.length} agents` : "Remove", danger: true, run: () => removeFlowNode(ed, agents.map((a) => a.id)) },
    nodes.length === 1 && nodes[0].kind === "goal" && "-",
    nodes.length === 1 && nodes[0].kind === "goal" && { label: "Remove Goal", danger: true, run: () => removeFlowNode(ed, nodes[0].id) },
  ], at);
}

// Copies agents with their links (between copied agents the copies link to
// each other) and their notebook, below the originals, and selects the copies.
function duplicateAgents(ed, canvas, ids) {
  const G = ed.graph, agents = ids.map((id) => fnode(G, id)).filter((n) => n && n.kind === "agent");
  if (!agents.length) return;
  ed.push();
  const map = {};
  for (const a of agents) {
    const c = structuredClone(a);
    c.id = fuid(G, a.name); c.name = a.name + " (copy)"; c.dynamic = false; c.pos = [a.pos[0] + 30, a.pos[1] + 130];
    G.nodes.push(c); map[a.id] = c.id;
  }
  for (const e of G.edges.slice()) {
    const from = map[e.from] || e.from, to = map[e.to] || e.to;
    if (from === e.from && to === e.to) continue;
    if (isFlowEdge(G, e) && !(map[e.from] && map[e.to])) continue;
    const c = { ...structuredClone(e), from, to, id: `${from}->${to}` };
    if (!G.edges.some((x) => x.id === c.id)) G.edges.push(c);
  }
  ed.onChange(); canvas.select(Object.values(map));
}

            }
          }),
          h("button", {
            class: "primary",
            text: "Copy Direct URL",
            onclick: async () => {
              await navigator.clipboard.writeText(fullUrl);
              toast("URL copied.");
            }
          })
        )
      ));
    })
  });
  newLabel.addEventListener("keydown", (e) => { if (e.key === "Enter") genBtn.click(); });

  // Whether other devices need a token. Applies at once; only this
  // computer may change it.
  const requireBox = h("input", { type: "checkbox", style: { width: "auto" }, onchange: guard(async (e) => {
    e.target.disabled = true;
    try { await api("/api/access", { method: "PUT", body: { require_token: e.target.checked } }); toast(e.target.checked ? "Access token required" : "Access token off"); }
    catch (x) { e.target.checked = !e.target.checked; throw x; }
    finally { e.target.disabled = false; }
  }) });
  const requireRow = h("label", { class: "row", style: { color: "var(--text)", marginTop: "10px" } }, requireBox, "Require an access token for other devices");
  api("/api/access").then((a) => { requireBox.checked = !!a.require_token; }).catch(() => {});
  const tokensCard = h("div", { class: "card" },
    h("div", { class: "row", style: { gap: "8px" } },
      icon("key", 18, { color: "var(--accent-fg)" }),
      h("h3", { class: "grow", style: { margin: 0 }, text: "Remote Access & Tokens" })
    ),
    requireRow,
    h("p", { class: "small muted", style: { margin: "8px 0 12px" }, text: "Manage security tokens for remote access via port forwarding or static IP. Local requests (localhost / 127.0.0.1) are always authenticated. With the token check on, remote requests without a valid token are blocked; with it off, any device that can reach this port can use orchopork by its IP address." }),
    h("div", { class: "row", style: { gap: "8px", marginBottom: "8px" } }, h("div", { class: "grow" }, extInp)),
    h("div", { class: "row wrap", style: { gap: "8px" } },
      h("div", { class: "grow", style: { flexBasis: "200px" } }, newLabel),
      genBtn
    ),
    tokensList
  );
  loadTokens();

  const allow = h("input", { type: "checkbox", style: { width: "auto" }, checked: cfg.limits.allow_commands });
  const netSel = h("select", { "aria-label": "Internet access for agents", style: { maxWidth: "420px" } },
    NET_LEVELS.map(([v, t, d]) => h("option", { value: v, text: `${t}: ${d}`, selected: (cfg.limits.allow_network === false ? "off" : cfg.limits.network || "full") === v })));
  const allowScreen = h("input", { type: "checkbox", style: { width: "auto" }, checked: !!cfg.limits.allow_screen_capture });
  const lim = (k, label) => { const i = h("input", { type: "number", value: cfg.limits[k] }); i.dataset.k = k; return h("div", {}, h("label", { text: label }), i); };
  const limits = h("div", { class: "kv2" },
    lim("steps_per_session", "Steps per session limit"), lim("max_failures", "Max consecutive failures"),
    lim("escalate_after", "Turn failures before escalation"), lim("command_timeout_secs", "Shell command timeout (seconds)"),
    lim("max_output_tokens", "Max output tokens per call"), lim("local_context_chars", "Local context budget (chars)"));
  const esc = h("input", { value: mref(cfg.routing.escalation), placeholder: "e.g. claude:claude-sonnet-5 (optional)", class: "mono" });
  const def = h("input", { value: mref(cfg.routing.actor), placeholder: "e.g. ollama:qwen2.5-coder:14b (optional)", class: "mono" });
  const parseRef = (v) => { v = v.trim(); if (!v) return null; const i = v.indexOf(":"); return i < 0 ? null : { provider: v.slice(0, i), model: v.slice(i + 1) }; };

  const skills = h("div");
  let saveRow;
  S.settingsDirty = false;
  const paintSkills = (list, errors) => skills.replaceChildren(...list.map((s) => h("label", { class: "row", style: { color: "var(--text)", fontSize: "13.5px", alignItems: "flex-start", gap: "10px", padding: "4px 0" } },
    h("input", { type: "checkbox", style: { width: "auto", marginTop: "4px" }, checked: s.enabled, onchange: guard(async (e) => { try { await api("/api/skills/toggle", { body: { name: s.name, on: e.target.checked } }); } catch (x) { e.target.checked = !e.target.checked; throw x; } }) }),
    h("span", {}, h("b", { text: s.name }), " ", h("span", { class: "pill", text: s.type.replace("_", " ") }),
      (s.roles || []).length > 0 && [" ", h("span", { class: "pill", title: "Only for agents with this role", text: (s.roles[0] === "*" ? "all orchestra agents" : s.roles.join(", ")) })],
      h("div", { class: "small muted", text: s.description })))),
    ...(errors || []).map((x) => h("div", { class: "small bad", text: `${x.path}: ${x.error}` })));
  paintSkills(ws.skills, ws.skill_errors);

  let avail = Object.fromEntries(((S.models && S.models.agents) || []).map((a) => [a.model, a.available]));
  const modelsReady = loadModels(true).catch(() => ({ models: [], agents: [], notes: [] }));
  let extAgents = structuredClone(cfg.external_agents || []);
  const agentsBox = h("div");
  const paintAgents = () => agentsBox.replaceChildren(h("div", { class: "agents-grid" }, extAgents.map((a, i) => {
    const name = h("input", { value: a.name, oninput: (e) => (a.name = e.target.value) });
    const mode = h("select", { title: (AGENT_MODES.find((m) => m.value === agentMode(a)) || {}).hint || "",
      onchange: (e) => { setAgentMode(a, e.target.value); e.target.title = AGENT_MODES.find((m) => m.value === e.target.value).hint; } },
      AGENT_MODES.map((m) => h("option", { value: m.value, text: m.name, selected: agentMode(a) === m.value })));
    const inherit = h("label", { class: "row small", title: "Run with this tool's own settings, MCP servers, plugins and memory files (CLI agents; off asks the CLI to ignore them where it can)" },
      h("input", { type: "checkbox", style: { width: "auto" }, checked: a.inherit_config !== false, onchange: (e) => { if (e.target.checked) delete a.inherit_config; else a.inherit_config = false; } }), "my config");
    const cmd = h("input", { class: "mono", value: [a.command, ...a.args].join(" "), title: "Command that starts the agent (for CLI agents, {prompt} or {prompt_file} in the args; otherwise the task goes to stdin)",
      oninput: (e) => { const parts = e.target.value.trim().split(/\s+/); a.command = parts[0] || ""; a.args = parts.slice(1); } });
    const out = h("span", { class: "small " + (avail[a.id] ? "ok" : "faint"), text: avail[a.id] ? "✓ ready" : avail[a.id] === false ? "not installed" : "checking…" });
    return [name, mode, cmd, inherit,
      h("button", { text: "Probe", title: "Start it: the ACP handshake, or --version for a CLI", onclick: guard(async (e) => {
        e.target.disabled = true; out.textContent = "probing…";
        try { const r = await api("/api/agents/probe", { body: { id: a.id } }); const info = r.info.agentInfo || {}; out.textContent = `✓ ${info.title || info.name || "ok"}`; out.className = "small ok"; }
        catch (x) { out.textContent = x.message; out.className = "small bad"; } finally { e.target.disabled = false; }
      }) }),
      h("button", { class: "ghost", text: "✕", title: "Remove", onclick: () => { extAgents.splice(i, 1); paintAgents(); } }),
      out];
  })));
  paintAgents();

  const agentsCard = h("details", { class: "card" }, h("summary", { style: { cursor: "pointer", fontWeight: 700 } }, "External Agents (Advanced)"),
    h("p", { class: "small muted", style: { margin: "8px 0 12px" }, text: "Claude Code, Codex, Gemini CLI, Antigravity, Cursor, Copilot, Aider and any other ACP agent or headless CLI. They execute using their native logins and setup without counting against Orchopork cloud caps (tokens they report show up in the metrics)." }),
    agentsBox,
    h("div", { class: "row", style: { marginTop: "12px" } }, h("button", { class: "ghost", text: "＋ Add Agent Command", onclick: () => {
      const id = uid(extAgents.map((x) => ({ id: x.id })), "agent"); extAgents.push({ id, name: "New Agent", command: "", args: [] }); paintAgents();
    } })));

  const connBox = h("div", { class: "conn", style: { marginTop: "12px" } }), notesBox = h("div");
  connBox.append(...Array.from({ length: 3 }, () => [h("div", {}, sk("sk-line w40"), sk("sk-line w60")), sk("sk-line"), h("span")]).flat());

  const fillConn = (data) => {
    const cfg = S.state.workspace.config, pv = Object.fromEntries(S.state.workspace.providers.map((p) => [p.id, p]));
    const count = (pred) => data.models.filter(pred).length;
    const rows = [];
    const row = (title, detail, ok, remove) => rows.push(h("div", {}, h("b", { text: title }), h("div", { class: "small " + (ok ? "muted" : "warn"), text: detail })),
      h("span", { class: "pill " + (ok ? "done" : ""), text: ok ? "connected" : "offline" }),
      remove ? h("button", { class: "ghost", text: "Remove", onclick: guard(async () => {
        if (!(await confirmBox({ title: `Remove ${title}?`, text: "Its models will disappear from pickers.", ok: "Remove", danger: true }))) return;
        await api("/api/models/remove", { body: remove }); S.models = null; route();
      }) }) : h("span"));

    const nOllama = count((m) => m.provider === "ollama");
    row("Ollama", `${cfg.ollama_url} · ${nOllama ? nOllama + " models" : "not reachable"}`, nOllama > 0, null);
    if (cfg.llamacpp_url) row("llama.cpp", cfg.llamacpp_url, count((m) => m.provider === "llamacpp") > 0, null);
    for (const p of ["claude", "gemini", "deepseek"]) if (pv[p] && pv[p].configured) row(p[0].toUpperCase() + p.slice(1), `${count((m) => m.provider === p)} models active`, true, { kind: "cloud", provider: p });
    for (const e of cfg.endpoints || []) row(e.name, `${e.base_url}${e.local ? " · local" : ""} · ${count((m) => m.provider === "compat" && m.model.startsWith(e.id + "/"))} models`, count((m) => m.model.startsWith(e.id + "/")) > 0, { kind: "endpoint", id: e.id });
    for (const a of data.agents || []) rows.push(h("div", {}, h("b", { text: a.name }), h("div", { class: "small muted", text: a.available ? `${a.kind || "ACP"} Agent` : "Not configured" })),
      h("span", { class: "pill " + (a.available ? "done" : ""), text: a.available ? "ready" : "—" }),
      a.available ? h("span") : h("button", { class: "ghost", text: "Set up", onclick: async () => { await openAddModel(); S.models = null; route(); } }));
    connBox.replaceChildren(...rows);
    connBox.classList.add("enter");
    notesBox.replaceChildren(data.notes.length > 0 ? h("div", { class: "small warn", style: { marginTop: "8px" }, text: data.notes.join(" · ") }) : "");
  };

  Promise.all([modelsReady, loadState().catch(() => {})]).then(([data]) => {
    if (!document.body.contains(connBox)) return;
    fillConn(data);
    avail = Object.fromEntries((data.agents || []).map((a) => [a.model, a.available]));
    paintAgents();
  });

  const connCard = h("div", { class: "card" },
    h("div", { class: "row" }, h("h3", { class: "grow", style: { margin: 0 }, text: "Configured Models & Providers" }),
      h("button", { class: "accent", text: "＋ Add Model / Provider", onclick: async () => { await openAddModel(); S.models = null; route(); } })),
    connBox, notesBox);

  inner.append(
    connCard,
    tuningCard,
    tokensCard,
    agentsCard,
    h("div", { class: "card" }, h("h3", { text: "Budget & Routing Limits" }),
      h("label", { text: "Monthly Cloud Budget Cap (USD)" }), cap,
      h("label", { text: "Escalation Model (Takes over after repeated failures)" }), esc,
      h("label", { text: "Default Actor Model" }), def),
    h("div", { class: "card" }, h("h3", { text: "Execution Safety" }), limits,
      h("label", { class: "row", style: { color: "var(--text)", marginTop: "14px" } }, allow, "Authorize agents to run shell commands and background processes in worktrees"),
      h("label", { text: "Internet access for agents", style: { marginTop: "14px" } }), netSel,
      h("p", { class: "small muted", style: { margin: "4px 0 0" }, text: "The most any agent may reach. In an orchestra each agent can narrow this for itself (double-click an agent → Internet access). It limits the web tools and refuses obvious download commands; it is not a firewall." }),
      h("label", { class: "row", style: { color: "var(--text)", marginTop: "6px" } }, allowScreen, "Let agents take screenshots of the whole screen (everything visible on this computer; may go to cloud vision models)")),
    h("div", { class: "card" }, h("div", { class: "row" }, h("h3", { class: "grow", text: "Skills & System Directives" }),
      h("button", { class: "ghost", text: "Reload Skills", onclick: guard(async () => { const r = await api("/api/skills/reload", { body: {} }); paintSkills(r.skills, r.errors); toast("Skills reloaded."); }) })), skills),
    saveRow = h("div", { class: "row savebar" },
      h("span", { class: "grow small muted", text: "Settings are saved immediately upon clicking Save." }),
      h("button", { class: "primary", text: "Save Configuration", onclick: guard(async () => {
        const fresh = (await api("/api/state")).workspace.config;
        const next = { ...fresh, monthly_cap_usd: Number(cap.value), ollama_num_ctx: Number(numCtx.value),
          routing: { ...fresh.routing, escalation: parseRef(esc.value), actor: parseRef(def.value) }, limits: { ...fresh.limits, allow_commands: allow.checked, allow_network: netSel.value !== "off", network: netSel.value === "off" ? (fresh.limits.network || "full") : netSel.value, allow_screen_capture: allowScreen.checked } };
        limits.querySelectorAll("input[data-k]").forEach((i) => { next.limits[i.dataset.k] = Number(i.value); });
        next.external_agents = extAgents.filter((a) => a.command.trim());
        await api("/api/config", { method: "PUT", body: next }); S.models = null; toast("Configuration saved.");
        setDirty(false);
      }) })));

  const setDirty = (v) => {
    S.settingsDirty = v;
    saveRow.firstChild.textContent = v ? "● Unsaved changes detected" : "Configuration is synchronized.";
    saveRow.firstChild.className = "grow small " + (v ? "warn" : "muted");
  };
  inner.addEventListener("input", (e) => { if (!skills.contains(e.target) && !tokensCard.contains(e.target)) setDirty(true); });
  inner.addEventListener("change", (e) => { if (!skills.contains(e.target) && !tokensCard.contains(e.target)) setDirty(true); });
  S.view.leave = () => !S.settingsDirty || confirm("You have unsaved changes. Leave anyway?");
}

// ---------- command palette (Ctrl/Cmd + K) ----------
function palette() {
  if ($(".pal")) return;
  const ws = S.state && S.state.workspace; if (!ws) return;
  const od = pget("orchDraft", null);
  const actions = [
    { g: "Actions", ic: "plus", t: "New task", k: "", run: () => go("#/") },
    od && { g: "Actions", ic: "fork", t: "Continue orchestra draft: " + firstLine(od.goal, 60), run: () => go("#/o/new") },
    { g: "Actions", ic: "gear", t: "Settings & models", run: () => go("#/models") },
    { g: "Actions", ic: "bolt", t: "Measurements", run: () => go("#/metrics") },
    { g: "Actions", ic: "swap", t: "Switch project…", run: switchProject },
    { g: "Actions", ic: "sidebar", t: "Toggle sidebar", run: () => toggleSide() },
  ].filter(Boolean);
  const seen = seenMap();
  const runs = [...(S.runs || [])].sort((a, b) => (b.status === "running") - (a.status === "running") || isUnread(b, seen) - isUnread(a, seen) || b.updated_at - a.updated_at)
    .map((r) => ({ g: "Conversations", dot: runState(r), ic: r.spec.mode === "orchestra" ? "fork" : "terminal", t: r.goal, k: `${STATE_LABEL[runState(r)]} · ${ago(r.updated_at)}`, extra: r.branch, run: () => go(runHash(r)) }));
  const projects = recents().filter((p) => p !== ws.root).map((p) => ({ g: "Projects", ic: "folder", t: baseName(p), k: p, run: guard(async () => { if (!(await openProject(p, h("div")))) switchProject(); }) }));
  const all = [...actions, ...runs, ...projects];
  const q = h("input", { placeholder: "Jump to conversation, project or command…" });
  const res = h("div", { class: "res" });
  let items = [], on = 0;
  const paint = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    items = all.filter((it) => { const hay = (it.t + " " + (it.k || "") + " " + (it.extra || "")).toLowerCase(); return words.every((w) => hay.includes(w)); });
    if (!words.length) items = [...actions, ...runs.slice(0, 8), ...projects];
    on = Math.min(on, Math.max(0, items.length - 1));
    const kids = []; let g = null;
    items.slice(0, 60).forEach((it, i) => {
      if (it.g !== g) { g = it.g; kids.push(h("div", { class: "grp", text: g })); }
      kids.push(h("div", { class: "it" + (i === on ? " on" : ""), onmousemove: () => { if (on !== i) { on = i; paint(); } }, onclick: () => pick(i) },
        it.dot ? h("span", { class: "sdot " + it.dot }) : null,
        h("span", { class: "pic" }, icon(it.ic, 13)),
        h("span", { class: "t", text: it.t }),
        it.k && h("span", { class: "k", text: it.k })));
    });
    res.replaceChildren(...(kids.length ? kids : [h("div", { class: "it faint", text: "Nothing matches." })]));
    res.querySelector(".it.on")?.scrollIntoView({ block: "nearest" });
  };
  const pick = (i) => { const it = items[i]; if (!it) return; close(); it.run(); };
  q.addEventListener("input", () => { on = 0; paint(); });
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); on = Math.min(items.length - 1, on + 1); paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); on = Math.max(0, on - 1); paint(); }
    else if (e.key === "Enter") { e.preventDefault(); pick(on); }
  });
  const close = modal(h("div", {}, q, res, h("div", { class: "hint" },
    h("span", { text: "↑↓ move" }),
    h("span", { text: "↵ select" }),
    h("span", { text: "esc close" }),
    h("span", { class: "grow" }),
    h("span", { text: baseName(ws.root) }))), { cls: "pal" });
  paint(); setTimeout(() => q.focus());
}

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") { e.preventDefault(); palette(); }
});
// Touch screens cannot hover: a tap on a step shows its tools (rewind,
// edit & resend), a tap elsewhere hides them again.
document.addEventListener("click", (e) => {
  if (!touchUI()) return;
  const wrap = e.target.closest && e.target.closest(".stepwrap");
  const interactive = e.target.closest && e.target.closest("button, a, summary, input, textarea, select, img, pre, .steptools");
  if (wrap && interactive) return;
  document.querySelectorAll(".stepwrap.tools-on").forEach((x) => x !== wrap && x.classList.remove("tools-on"));
  if (wrap) wrap.classList.toggle("tools-on");
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.detail && S.view && S.view.id === S.detail.run.id) markSeen(S.detail.run);
});

// ---------- live events ----------
let refetchT = null;
// Everything shown may be stale (events were missed): refetch it.
function resync() {
  refreshSide();
  if (S.view && S.view.refresh) S.view.refresh().catch(() => {});
}

function connectEvents() {
  if (S.es) return;
  const tok = getAuthToken();
  const url = tok ? `/api/events?token=${encodeURIComponent(tok)}` : "/api/events";
  const es = S.es = new EventSource(url);
  // After a reconnect, whatever happened meanwhile was not delivered.
  es.onopen = () => { if (S.esReconnect) resync(); S.esReconnect = false; };
  es.onmessage = (msg) => {
    let ev;
    try { ev = JSON.parse(msg.data); } catch { return; }
    if (ev.kind === "resync") { resync(); return; }
    const runId = ev.run ? ev.run.id : ev.step ? ev.step.run_id : ev.run_id;
    if (ev.kind === "live") { onLive(ev); return; }
    if (ev.kind === "step") clearLive(ev.step.run_id, ev.step.meta && ev.step.meta.agent);
    if (ev.kind === "log") { if (S.view && S.view.id === runId) setLive(ev.message); return; }
    if (ev.kind === "approval" && ev.approval && !(S.view && S.view.id === runId && !document.hidden)) {
      const r = (S.runs || []).find((x) => x.id === runId);
      const what = APPROVAL_VERB[ev.approval.tool] || ev.approval.tool;
      if (!(S.view && S.view.id === runId)) toast("Approval needed: " + what, false, r ? { label: "Review", run: () => go(runHash(r)) } : null);
      if (document.hidden && store.get("notify", false) && "Notification" in window && Notification.permission === "granted") {
        try { new Notification("Approval needed: " + what, { body: r ? firstLine(r.goal, 120) : "", tag: "approval-" + runId }); } catch {}
      }
    }
    if (ev.kind === "run" && S.runs) {
      const i = S.runs.findIndex((r) => r.id === ev.run.id);
      if (i >= 0) { const before = S.runs[i]; S.runs[i] = ev.run; announce(before, ev.run); }
    }
    if (S.view && S.view.id === runId && S.view.refresh) { clearTimeout(refetchT); refetchT = setTimeout(() => S.view.refresh().catch(() => {}), 120); }
    if (ev.kind === "run" || ev.kind === "deleted") refreshSide();
  };
  es.onerror = () => {
    es.close();
    if (S.es !== es) return; // replaced meanwhile (project switch)
    S.es = null; S.esReconnect = true;
    setTimeout(connectEvents, 2000);
  };
}

// The event stream belongs to one workspace's engine: reconnect after a switch.
function resetEvents() {
  if (S.es) { S.es.close(); S.es = null; }
}

function announce(before, run) {
  if (before.status !== "running" || run.status === "running") return;
  const watching = S.view && S.view.id === run.id && !document.hidden;
  if (watching) return;
  const st = runState(run);
  const msg = (st === "done" ? "Finished: " : st === "error" ? "Stopped: " : "Paused: ") + firstLine(run.goal, 60);
  if (!(S.view && S.view.id === run.id)) toast(msg, false, { label: "Open", run: () => go(runHash(run)) });
  if (document.hidden && store.get("notify", false) && "Notification" in window && Notification.permission === "granted") {
    try {
      const n = new Notification(msg, { body: (run.error ? firstLine(run.error, 140) + "\n" : "") + baseName(wsKey()), tag: run.id });
      n.onclick = () => { window.focus(); go(runHash(run)); n.close(); };
    } catch {}
  }
}

let sideT = null;
function refreshSide() {
  clearTimeout(sideT);
  sideT = setTimeout(async () => {
    try {
      await loadState(); await loadRuns();
      replaceSide();
      if (S.view && S.view.kind === "home") S.view.refresh();
    } catch {}
  }, 250);
}

route();
</script>
