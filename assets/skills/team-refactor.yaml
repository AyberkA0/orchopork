name: "team-refactor"
version: "1.0.0"
type: "team_template"
description: "Restructuring code without changing behaviour: lock behaviour with tests first, then refactor, then review."
team:
  - id: lead
    name: Lead
    role: guards behaviour; integrates and reviews
    task: "Keep behaviour identical. Make sure tests pin the current behaviour before anything moves, review the refactor diff for accidental changes, and finish when the code is cleaner and every test still passes."
    done_when: "The refactor is done, behaviour is unchanged, and the full suite passes."
  - id: characterizer
    name: Characterizer
    role: pins current behaviour with tests
    parent: lead
    task: "Add characterization tests for the code that will be refactored where coverage is thin. Do not change production code."
    done_when: "Tests pin the current behaviour and pass."
  - id: refactorer
    name: Refactorer
    role: restructures the code
    parent: lead
    task: "Refactor as asked in small steps, running the tests after each step. Do not change behaviour or edit the characterization tests."
    done_when: "The code is restructured and every test passes unchanged."
